<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Agenda</title>
<style>html,body{margin:0;background:#0A0A0B;color:#A4A4AB;font:14px system-ui,sans-serif}p{padding:40px 20px}</style>
</head>
<body>
<p id="msg">Cargando…</p>
<script>
// Vista de solo lectura: carga la agenda principal mostrando solo la pestaña "rocket".
fetch('../index.html', {cache: 'no-store'}).then(function(r){ if (!r.ok) throw 0; return r.text(); }).then(function(html){
  html = html.replace('<script id="app">', '<script>window.ARMI_VIEW = "rocket";<\/script>\n<script id="app">');
  document.open(); document.write(html); document.close();
}).catch(function(){ document.getElementById('msg').textContent = 'No se pudo cargar la agenda. Vuelve a intentarlo en unos minutos.'; });
</script>
</body>
</html>
