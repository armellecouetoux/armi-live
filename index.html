</head>
<body>ARMI
<script>
// Portada neutra para cualquiera. Si este navegador tiene el token de GitHub de la dueña
// (el mismo de "Sincronizar dispositivos") y ese token puede escribir en el repo,
// se carga aquí mismo la agenda completa. El código de la ruta no aparece en esta página.
(async function(){
  var t = ''; try { t = localStorage.getItem('armi-gh-token') || ''; } catch(e){}
  if (!t) return;
  var H = {'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + t};
  var API = 'https://api.github.com/repos/armellecouetoux/master-to-do';
  try {
    var r = await fetch(API, {headers: H, cache: 'no-store'}); if (!r.ok) return;
    var repo = await r.json(); if (!repo.permissions || !repo.permissions.push) return;
    var ls = await fetch(API + '/contents/?ref=main', {headers: H, cache: 'no-store'}); if (!ls.ok) return;
    var dirs = (await ls.json()).filter(function(x){ return x.type === 'dir' && /^[a-z0-9]{10,}$/.test(x.name); });
    for (var i = 0; i < dirs.length; i++){
      var p = await fetch(dirs[i].name + '/index.html', {cache: 'no-store'}); if (!p.ok) continue;
      var html = await p.text();
      if (html.indexOf('id="p-home"') < 0) continue;
      document.open(); document.write(html); document.close(); return;
    }
  } catch(e){}
})();
</script>
</body>
</html>
