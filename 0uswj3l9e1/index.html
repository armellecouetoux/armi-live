<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santaló Candles · Calendario editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#fbf6ee;--bg2:#f6efe3;--bg3:#f1e8d9;--card:#fff;--line:#efe6d8;--line2:#e2d6c3;
  --tx:#1d1b18;--tx2:#5d574e;--tx3:#a39a8c;--ink:#161616;--lime:#e4ff3a;--lime2:#f4ffb0;
  --accent:#6c5ce7;--red:#e5484d;--redbg:#ffecec;--amber:#b7791f;--amberbg:#fff4dc;--green:#2f9e5b;
  --paid:#ff8a3d;--paidbg:#fff0e5;
  --r:16px;--sh:0 1px 2px rgba(60,40,10,.04),0 8px 24px -12px rgba(60,40,10,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-size:13.5px;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h3,h4,.disp{font-family:'Bricolage Grotesque',Inter,sans-serif}
.app{display:flex;height:100vh;overflow:hidden}
/* Sidebar */
.side{width:236px;flex:none;background:var(--ink);color:#e9e5dc;display:flex;flex-direction:column;padding:14px 10px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:13px;transform:rotate(-6deg);font-family:'Bricolage Grotesque',sans-serif}
.brand b{display:block;font-size:14px;color:#fff;font-family:'Bricolage Grotesque',sans-serif}
.brand small{color:#8f8a80;font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;color:#c9c4b9;text-decoration:none;font-weight:500;cursor:pointer;transition:background .15s,transform .15s}
.nav a:hover{background:#262522;color:#fff;transform:translateX(2px)}
.nav a.on{background:var(--lime);color:var(--ink);font-weight:600}
.nav a .ic{width:20px;text-align:center;font-size:15px}
.nav a .ct{margin-left:auto;font-size:11px;opacity:.7;font-weight:600}
.nav a .ct.red{color:#ff8f8f;opacity:1}
.nav a.on .ct.red{color:var(--red)}
.navlbl{font-size:10.5px;color:#7d786e;padding:16px 10px 5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.side .foot{margin-top:auto;padding:14px 8px 2px;font-size:11px;color:#8f8a80;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.side .foot .syn{display:flex;align-items:center;gap:6px;flex:1 1 100%;margin-top:8px;line-height:1.35}
.dotst{width:8px;height:8px;border-radius:50%;background:#8f8a80;flex:none}
.dotst.ok{background:#54d38a}.dotst.warn{background:#ffc53d}.dotst.err{background:var(--red)}
.btn-new{margin:0 2px 14px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--lime);color:var(--ink);border:0;border-radius:14px;padding:10px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 0 #a9c21c}
.btn-new:hover{transform:translateY(-1px)}
.btn-new:active{transform:translateY(3px);box-shadow:0 1px 0 #a9c21c}
.lang{display:inline-flex;border:1px solid #3a3833;border-radius:8px;overflow:hidden;margin-left:auto}
.lang button{border:0;background:transparent;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;color:#8f8a80}
.lang button.on{background:var(--lime);color:var(--ink)}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;align-items:flex-end;gap:4px;padding:10px 22px 0;overflow-x:auto;flex:none;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:8px;padding:8px 14px 9px;border-radius:14px 14px 0 0;cursor:pointer;color:var(--tx2);font-weight:600;white-space:nowrap;background:var(--bg3);max-width:260px;transition:background .15s}
.tab:hover{background:#ece2d0}
.tab.on{background:var(--card);color:var(--tx);box-shadow:0 -2px 10px -6px rgba(60,40,10,.25)}
.tab .cd{width:10px;height:10px;border-radius:50%;flex:none}
.tab .nm{overflow:hidden;text-overflow:ellipsis}
.tab .mn{border:0;background:transparent;cursor:pointer;color:var(--tx3);padding:0 4px;border-radius:6px;font-size:15px;line-height:1}
.tab .mn:hover{background:var(--bg3);color:var(--tx)}
.tab .ct{font-size:11px;color:var(--red)}
.tabadd{border:1px dashed var(--line2);background:transparent;color:var(--tx3);cursor:pointer;padding:6px 12px;border-radius:12px;white-space:nowrap;font-weight:600;margin-bottom:4px}
.tabadd:hover{color:var(--tx);border-color:var(--tx3);background:#fff}
.workspace{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border-radius:18px 18px 0 0;margin:0 10px;box-shadow:0 -1px 0 var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:16px 26px 12px;min-height:60px}
.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.02em}
.top .sub{color:var(--tx3);font-size:12.5px;margin-top:2px}
.top .sp{flex:1}
.top .today{background:var(--bg2);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--tx2);font-weight:500}
.mob-toggle{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer}
.content{flex:1;overflow:auto;padding:6px 26px 70px}
.demo-banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--amberbg);border:1px dashed #efd18f;color:#7a5512;border-radius:14px;padding:10px 14px;margin-bottom:18px;font-size:12.5px}
.demo-banner .sp{flex:1}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:11px;padding:7px 12px;cursor:pointer;font-weight:600;white-space:nowrap;line-height:1.2;transition:transform .12s,background .12s}
.btn:hover{background:var(--bg2);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ink);color:var(--lime);border-color:var(--ink)}
.btn.pri:hover{background:#000}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg2)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:9px}
.btn.icon{padding:5px 8px}
.seg{display:inline-flex;border-radius:12px;padding:3px;background:var(--bg2);gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--ink);color:var(--lime)}
/* Cards & KPIs */
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{border-radius:18px;padding:14px 16px;background:var(--kc,#f7f1e6);cursor:pointer;transition:transform .2s;position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-3px) rotate(-.5deg)}
.kpi .emo{position:absolute;right:10px;top:8px;font-size:26px;opacity:.9;transition:transform .3s}
.kpi:hover .emo{transform:scale(1.2) rotate(10deg)}
.kpi .l{color:var(--tx2);font-size:12px;font-weight:600}
.kpi .v{font-size:32px;font-weight:700;margin-top:8px;letter-spacing:-.03em;font-family:'Bricolage Grotesque',sans-serif}
.kpi .h{font-size:11px;color:var(--tx2);opacity:.75;margin-top:1px}
.kpi.alert{background:#ffe1e1}.kpi.alert .v{color:var(--red)}
.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:18px}
.card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.card h3 small{font-weight:400;color:var(--tx3);font-family:Inter,sans-serif;font-size:12px}
.two{grid-template-columns:1fr 1fr}
.sec{margin-top:16px}
/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center;font-size:12.5px}
.bar .nm{color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.bar .tr{height:12px;background:var(--bg2);border-radius:8px;position:relative}
.bar .fl{height:100%;border-radius:8px;background:var(--ink);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar .tg{position:absolute;top:-4px;width:3px;height:20px;background:var(--ink);border-radius:2px}
.bar .n{text-align:right;color:var(--tx2);font-variant-numeric:tabular-nums;font-weight:600}
.pipe{display:flex;height:16px;border-radius:10px;overflow:hidden;background:var(--bg2);gap:2px}
.pipe span{height:100%;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--tx2)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:20px;font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--c) 16%,#fff);color:color-mix(in srgb,var(--c) 70%,#000);white-space:nowrap;line-height:1.55}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--bg2);color:var(--tx2);font-size:11.5px;white-space:nowrap;font-weight:500}
.tag.red{background:var(--redbg);color:var(--red)}
.tag.amber{background:var(--amberbg);color:var(--amber)}
.tag.viral{background:#efe7ff;color:#6b3fd6}
.tag.ads{background:var(--paidbg);color:#c25412}
.tag.lime{background:var(--lime2);color:#4d5a00}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none;border:2px solid #fff}
/* filters */
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.fbar .search{position:relative;flex:0 1 250px;min-width:160px}
.fbar .search input{width:100%;padding:7px 10px 7px 30px}
.fbar .search span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.inp,.fbar input,.fbar select{border:1px solid var(--line2);border-radius:10px;padding:7px 9px;background:#fff;outline:none;min-width:0}
.fbar select{max-width:160px}
.fbar select.act,.fbar input.act{border-color:var(--ink);background:var(--lime2)}
.inp:focus,.fbar input:focus,.fbar select:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--lime2)}
.chk{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line2);border-radius:10px;cursor:pointer;background:#fff;user-select:none;font-weight:500}
.chk.act{border-color:var(--red);color:var(--red);background:var(--redbg)}
/* tables */
.tblwrap{border:1px solid var(--line);border-radius:var(--r);overflow:auto;background:#fff}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--bg2);text-align:left;font-weight:600;color:var(--tx2);font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--tx)}
td{padding:4px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fffbf4}
td .cell{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 7px;width:100%;outline:none;min-width:70px}
td .cell:hover{border-color:var(--line)}
td .cell:focus{border-color:var(--ink);background:#fff}
td select.cell{min-width:118px;cursor:pointer;appearance:none;-webkit-appearance:none}
td .ttl{min-width:240px;font-weight:600}
td.id{color:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums;cursor:pointer}
td.id:hover{color:var(--accent)}
td.late input{color:var(--red);font-weight:600}
.rowact{display:flex;gap:2px;opacity:.5}
tr:hover .rowact{opacity:1}
.stsel{border-radius:20px!important;padding:4px 10px!important;font-size:11.5px;font-weight:600;min-width:110px!important}
/* calendar */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.calbar .lbl{font-size:20px;font-weight:700;min-width:180px;text-transform:capitalize;font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.calwrap{display:flex;gap:14px;align-items:flex-start}
.calmain{flex:1;min-width:0}
.layers{display:inline-flex;gap:6px;flex-wrap:wrap}
.layer{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;user-select:none}
.layer.on.paid{background:var(--paidbg);border-color:#ffc49c;color:#c25412}
.layer.on.mom{background:#f3ecff;border-color:#d8c8ff;color:#6b3fd6}
.layer.on.hint{background:var(--lime2);border-color:#d6ec5a;color:#4d5a00}
.month{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--bg2)}
.mhead div{padding:8px 10px;font-size:11.5px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.wk{border-top:1px solid var(--line)}
.wk:first-of-type{border-top:0}
.bands{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px 0;padding:4px 0 0}
.bands:empty{display:none}
.band{margin:0 3px;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.6}
.band.paid{background:repeating-linear-gradient(135deg,#ffe3cf 0 8px,#ffd7bb 8px 16px);color:#9c4210}
.band.paid.tbd{background:repeating-linear-gradient(135deg,#fff3ea 0 8px,#fff 8px 16px);border:1px dashed #ffb27d}
.band.mom{background:color-mix(in srgb,var(--c) 22%,#fff);color:color-mix(in srgb,var(--c) 60%,#000)}
.band:hover{filter:brightness(.97)}
.cells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.c{min-height:116px;border-right:1px solid var(--line);padding:5px;position:relative;display:flex;flex-direction:column;gap:4px;transition:background .15s}
.c:nth-child(7n){border-right:0}
.c.out{background:#fcfaf6}
.c.out .dn{opacity:.45}
.c .dn{font-size:12.5px;font-weight:700;color:var(--tx2);display:flex;align-items:center;justify-content:space-between;height:24px;padding:0 2px}
.c.today{background:#fdffe8}
.c.today .dn b{background:var(--ink);color:var(--lime);border-radius:12px;padding:2px 8px}
.c .add{opacity:0;border:0;background:var(--bg2);cursor:pointer;color:var(--tx2);font-size:14px;line-height:1;padding:2px 6px;border-radius:7px}
.c:hover .add{opacity:1}
.c .add:hover{background:var(--ink);color:var(--lime)}
.ms{display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:#7a5512;background:var(--amberbg);border-radius:6px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms.paid{color:#9c4210;background:var(--paidbg)}
.ev{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 7px;border-radius:9px;background:color-mix(in srgb,var(--pc) 18%,#fff);cursor:pointer;overflow:hidden;white-space:nowrap;transition:transform .12s;border:1px solid color-mix(in srgb,var(--pc) 30%,#fff)}
.ev:hover{transform:scale(1.03)}
.ev .fe{flex:none}
.ev .t{color:var(--tx2);font-variant-numeric:tabular-nums;flex:none;font-size:10.5px}
.ev .n{overflow:hidden;text-overflow:ellipsis;flex:1;font-weight:600}
.ev .s{width:8px;height:8px;border-radius:50%;background:var(--sc);flex:none;box-shadow:0 0 0 2px #fff}
.ev.late{outline:2px solid var(--red);outline-offset:-1px}
.hint{border:1.5px dashed var(--line2);border-radius:9px;padding:3px 7px;font-size:11px;color:var(--tx3);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s}
.hint:hover{border-color:var(--ink);color:var(--ink);background:var(--lime2)}
.more{font-size:11px;color:var(--tx3);padding:1px 6px;cursor:pointer;font-weight:600}
.more:hover{color:var(--tx)}
.dragover{outline:3px dashed var(--ink);outline-offset:-4px;background:var(--lime2)!important}
.weekbands{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.weekbands .band{margin:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{background:var(--bg2);border-radius:16px;min-height:430px;display:flex;flex-direction:column}
.wcol .wh{padding:10px 12px;display:flex;align-items:baseline;gap:6px}
.wcol .wh b{font-size:22px;font-weight:700;font-family:'Bricolage Grotesque',sans-serif}
.wcol .wh span{color:var(--tx3);font-size:12px;text-transform:capitalize;font-weight:600}
.wcol.today{background:#f7ffc9}
.wcol .wb{padding:0 8px 8px;display:flex;flex-direction:column;gap:7px;flex:1}
.wcol .wadd{margin-top:auto;border:1.5px dashed var(--line2);background:transparent;border-radius:11px;padding:7px;color:var(--tx3);cursor:pointer;font-size:12px;font-weight:600}
.wcol .wadd:hover{color:var(--ink);border-color:var(--ink);background:#fff}
.kc{background:#fff;border:1px solid var(--line);border-left:5px solid var(--pc,var(--line2));border-radius:13px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:transform .15s,box-shadow .15s}
.kc:hover{transform:translateY(-2px) rotate(-.4deg);box-shadow:var(--sh)}
.kc .tt{font-weight:600;line-height:1.35;white-space:normal}
.kc .mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2)}
.kc .mt .sp{flex:1}
.kc.late{border-color:#ffc9c9;border-left-color:var(--red)}
.unsched{width:240px;flex:none;border-radius:18px;background:var(--bg2);padding:12px;max-height:calc(100vh - 230px);overflow:auto}
.unsched h4{margin:0 0 4px;font-size:14px}
.unsched p{margin:0 0 10px;font-size:11.5px;color:var(--tx3);line-height:1.4}
.unsched .kc{margin-bottom:7px}
.lgroup{margin-bottom:18px}
.lgroup h4{font-size:13px;font-weight:700;margin:0 0 6px;color:var(--tx2);display:flex;align-items:center;gap:8px;text-transform:capitalize}
.lrow{display:grid;grid-template-columns:52px 140px 1fr 160px 120px 130px;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-top:0;background:#fff;cursor:pointer}
.lrow:first-of-type{border-top:1px solid var(--line);border-radius:14px 14px 0 0}
.lrow:last-child{border-radius:0 0 14px 14px}
.lrow:only-of-type{border-radius:14px}
.lrow:hover{background:#fffbf4}
.lrow .tm{color:var(--tx3);font-variant-numeric:tabular-nums}
.lrow .tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sm{color:var(--tx3);font-size:12px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(7,minmax(215px,1fr));gap:10px;overflow-x:auto;padding-bottom:10px}
.kcol{background:var(--bg2);border-radius:18px;display:flex;flex-direction:column;min-height:320px}
.kcol .kh{display:flex;align-items:center;gap:7px;padding:12px;font-weight:700;font-size:13px}
.kcol .kh .n{background:#fff;border-radius:10px;padding:0 7px;font-size:11.5px;color:var(--tx2)}
.kcol .kb{padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;flex:1}
.flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12px;color:var(--tx3);margin-bottom:14px}
.flow b{color:var(--tx2);font-weight:600;background:var(--bg2);border-radius:20px;padding:3px 9px}
/* ideas */
.capture{display:flex;gap:8px;flex-wrap:wrap;background:var(--lime2);border-radius:18px;padding:12px;margin-bottom:16px}
.capture input[type=text]{flex:1 1 260px;border-color:transparent}
.ideas{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.idea{border-radius:18px;padding:14px;background:color-mix(in srgb,var(--pc,#ddd) 12%,#fff);border:1px solid color-mix(in srgb,var(--pc,#ddd) 25%,#fff);display:flex;flex-direction:column;gap:8px;transition:transform .2s}

.idea .ds{color:var(--tx2);font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.idea .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto}

.pil h4{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.pil h4 .sp{flex:1}
.pil .big{font-size:30px;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;color:color-mix(in srgb,var(--c) 75%,#000);letter-spacing:-.03em}
.pil dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:5px 10px;font-size:12px}
.pil dt{color:var(--tx3)}
.pil dd{margin:0;color:var(--tx2);line-height:1.45}
.pil .pct{display:flex;gap:16px;padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--c) 35%,#fff);font-size:12px;color:var(--tx2);align-items:center}
.pil .pct b{font-size:17px;color:var(--tx);display:block;font-weight:700}
.dist{display:grid;grid-template-columns:190px 1fr 70px 70px 100px;gap:10px;align-items:center;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.dist:last-child{border-bottom:0}
.dist.h{color:var(--tx3);font-size:11.5px;font-weight:600}
/* rhythm */
.rhythm{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.slot{border-radius:16px;padding:12px 14px;background:#fff;border:1px solid var(--line);position:relative}
.slot.bonus{background:var(--bg2);border-style:dashed}
.slot .d{font-size:11.5px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.slot .f{font-size:20px;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;margin:2px 0}
.slot .p{font-size:12px;color:var(--tx2)}
.slot .ok{position:absolute;right:10px;top:10px;font-size:18px}
.viralbar{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;margin-top:10px}
.viralbar b{font-size:26px;color:var(--lime);font-family:'Bricolage Grotesque',sans-serif;white-space:nowrap}
.viralbar span{font-size:12.5px;line-height:1.4;opacity:.9}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:14px;height:14px;border-radius:50%;background:#3a3833}
.dots i.on{background:var(--lime)}

.paidhero{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.money{background:var(--ink);color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden}
.money h3{color:#fff;margin:0 0 4px;font-size:18px}
.money .code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--lime);opacity:.9}
.money .row{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px}
.money .row div b{display:block;font-size:24px;font-family:'Bricolage Grotesque',sans-serif;color:var(--lime)}
.money .row div{font-size:11.5px;color:#bdb8ad}
.money .coin{position:absolute;right:-10px;bottom:-20px;font-size:90px;opacity:.12;transform:rotate(-15deg)}
.gantt{position:relative;border:1px solid var(--line);border-radius:18px;background:#fff;padding:12px 14px 14px;overflow-x:auto}
.gantt .gscale{position:relative;height:22px;margin-left:120px;font-size:11px;color:var(--tx3);font-weight:600}
.gantt .gscale span{position:absolute;top:0;white-space:nowrap;border-left:1px solid var(--line);padding-left:4px}
.gantt .glane{display:flex;align-items:center;min-height:38px}
.gantt .glane .gl{width:120px;flex:none;font-size:12px;font-weight:700;color:var(--tx2)}
.gantt .gtrack{position:relative;flex:1;height:32px;background:var(--bg2);border-radius:10px}
.gantt .gbar{position:absolute;top:3px;bottom:3px;border-radius:8px;padding:0 8px;font-size:11px;font-weight:700;display:flex;align-items:center;white-space:nowrap;overflow:hidden;cursor:pointer}
.gantt .gbar.paid{background:repeating-linear-gradient(135deg,#ffd4b5 0 8px,#ffc79f 8px 16px);color:#8a3a0c}
.gantt .gbar.paid.tbd{background:repeating-linear-gradient(135deg,#fff3ea 0 8px,#fff 8px 16px);border:1px dashed #ffb27d}
.gantt .gbar.mom{background:color-mix(in srgb,var(--c) 30%,#fff);color:color-mix(in srgb,var(--c) 60%,#000)}
.gantt .gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:2}
.gantt .gms{position:absolute;top:50%;transform:translate(-50%,-50%) rotate(45deg);width:12px;height:12px;background:var(--ink);border:2px solid var(--lime);z-index:3;cursor:help}
.mini{display:flex;flex-direction:column}
.mini .it{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
.mini .it:last-child{border-bottom:0}
.mini .it:hover .tt{color:var(--accent)}
.mini .dt{width:68px;flex:none;color:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.mini .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.note{font-size:12px;color:var(--tx3);line-height:1.5}
.warnbox{background:var(--amberbg);color:#7a5512;border-radius:12px;padding:9px 12px;font-size:12px;margin-bottom:12px}
.setrow{display:grid;grid-template-columns:210px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .l b{display:block;font-weight:700;margin-bottom:3px}
.setrow .l span{font-size:12px;color:var(--tx3);line-height:1.4}
.setrow textarea{width:100%;min-height:56px}
.empty{text-align:center;padding:40px 20px;color:var(--tx3);border:2px dashed var(--line2);border-radius:18px;font-size:14px}
.empty .big{font-size:40px;display:block;margin-bottom:6px}
.loadingws{padding:60px 20px;text-align:center;color:var(--tx3)}
.mini-tbl td{padding:3px 6px}
.mini-tbl .cell{min-width:60px}
.paidstat{border-radius:20px!important;font-size:11.5px;font-weight:600;min-width:110px!important}

.scrim{position:fixed;inset:0;background:rgba(30,25,15,.32);z-index:40;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:10px;right:10px;bottom:10px;width:min(650px,calc(100vw - 20px));background:#fff;z-index:50;box-shadow:-8px 0 40px rgba(30,25,15,.18);display:flex;flex-direction:column;transform:translateX(110%);transition:transform .28s cubic-bezier(.2,.9,.25,1.1);border-radius:22px;overflow:hidden}
.drawer.on{transform:none}
.dhd{padding:16px 22px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--pc,#eee) 12%,#fff)}
.dhd .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dhd .row .sp{flex:1}
.dhd .tinput{width:100%;font-size:22px;font-weight:700;border:0;outline:none;padding:10px 0 4px;letter-spacing:-.02em;background:transparent;font-family:'Bricolage Grotesque',sans-serif}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.steps button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:11.5px;cursor:pointer;color:var(--tx2);display:flex;align-items:center;gap:5px;font-weight:600}
.steps button i{width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.35}
.steps button.done i{opacity:1}
.steps button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--tx)}
.steps button.on i{opacity:1}

.tog input{display:none}
.tog.on.v{background:#efe7ff;border-color:#c8b2ff;color:#6b3fd6}

.menu.on{display:block}

.menu button:hover{background:var(--bg2)}
.menu button.danger{color:var(--red)}

.toast.on{opacity:1;transform:translateX(-50%)}
.toast button{background:transparent;border:0;color:var(--lime);cursor:pointer;font-weight:700}
.confetti{position:fixed;top:-10px;z-index:80;pointer-events:none;font-size:18px;animation:fall 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.3}}

@media (max-width:980px){
  .two{grid-template-columns:1fr}

}

  .setrow{grid-template-columns:1fr}
  .bar{grid-template-columns:100px 1fr 36px}
  .demo-banner .sp{display:none}
  .drawer{top:0;right:0;bottom:0;width:100vw;border-radius:0}

const b64e=x=>btoa(unescape(encodeURIComponent(x)));

const ghUrl=()=>'https://api.github.com/repos/'+GH.repo+'/contents/'+GH.path;
const ghH=()=>({'Accept':'application/vnd.github+json','Authorization':'Bearer '+ghTok()});
async function ghFetch(){
  if(ghTok()){const r=await fetch(ghUrl()+'?ref=main&t='+Date.now(),{headers:ghH(),cache:'no-store'});if(r.status===404){ghSha=null;return null}if(!r.ok)throw r.status;const j=await r.json();ghSha=j.sha;return JSON.parse(b64d(j.content))}
  const r=await fetch(GH.path.split('/').pop()+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;return await r.json();
}
function ghSchedule(){if(!ghTok()){setSync('local','sync_ghlocal');return}setSync('saving','sync_saving');clearTimeout(ghT);ghT=setTimeout(()=>ghPush(),1200)}
async function ghPush(retry){
  if(ghBusy){ghAgain=true;return}ghBusy=true;
  try{
    const body={message:'Calendario editorial: guardar',content:b64e(JSON.stringify({v:2,updatedAt:new Date().toISOString(),clients:CL,ws:WS_CACHE},null,1)),branch:'main'};
    if(ghSha)body.sha=ghSha;
    const r=await fetch(ghUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghH()),body:JSON.stringify(body)});
    if((r.status===409||r.status===422)&&!retry){try{const g=await fetch(ghUrl()+'?ref=main&t='+Date.now(),{headers:ghH(),cache:'no-store'});ghSha=g.ok?(await g.json()).sha:null}catch(e){}ghBusy=false;return ghPush(true)}
    if(!r.ok)throw r.status;
    const j=await r.json();ghSha=j.content&&j.content.sha;setSync('cloud','sync_gh');
  }catch(e){setSync('err','sync_gherr')}

}
let db=null,cloud=false;const writers={};const subs={};

function syncHTML(){const c=sync.mode==='cloud'?'ok':sync.mode==='saving'?'warn':sync.mode==='err'?'err':'';return `<span class="dotst ${c}"></span><span>${esc(t(sync.key))}</span>`}

function writer(path){
  if(writers[path])return writers[path];
  const w={path,writing:false,pending:null,last:'',timer:null};
  w.push=j=>{w.pending=j;clearTimeout(w.timer);w.timer=setTimeout(()=>run(w),450)};
  return writers[path]=w;
}
async function run(w){
  if(!db||!cloud||w.writing||w.pending==null)return;
  const j=w.pending;w.pending=null;
  if(j===w.last){maybeSynced();return}
  w.writing=true;
  const doSet=()=>db.doc(w.path).set({state:j,updatedAt:new Date().toISOString()});
  try{await doSet();w.last=j}
  catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await doSet();w.last=j}catch(e2){setSync('err','sync_err')}}
    else if(e&&(e.code==='invalid_argument'||e.code==='not_granted'))setSync('err','sync_ro');
    else if(e&&e.code==='quota_exceeded')setSync('err','sync_err');
    else setSync('err','sync_err');
  }
  w.writing=false;
  if(w.pending!=null)run(w);else maybeSynced();
}
function maybeSynced(){if(sync.mode==='err')return;if(Object.values(writers).some(w=>w.writing||w.pending!=null))return;setSync('cloud','sync_cloud')}
function save(){ // save active workspace
  if(!S)return;S.updatedAt=new Date().toISOString();WS_CACHE[ACTIVE]=S;lsSave();

  else setSync('local','sync_local');
}
function saveClients(){lsSave();if(GH){ghSchedule();return}if(db&&cloud){setSync('saving','sync_saving');writer('meta/clients').push(JSON.stringify(CL))}}
function subscribeWs(id){
  if(!db||!cloud)return;
  if(subs.ws){subs.ws();subs.ws=null}
  const path='workspaces/'+id;let gotFinal=false;
  subs.ws=db.doc(path).onSnapshot(snap=>{
    if(id!==ACTIVE)return;
    const w=writer(path);
    if(snap.exists){
      const j=snap.data()&&snap.data().state;
      if(typeof j==='string'&&j!==w.last&&j!==JSON.stringify(S)){
        let st=null;try{st=normalize(JSON.parse(j))}catch(e){}
        if(st&&!(w.writing||w.pending!=null)){w.last=j;S=st;WS_CACHE[id]=st;lsSave();wsLoading=false;render();if(UI.drawer&&!UI.dirty)refreshDrawerFromState()}
      }else if(typeof j==='string')w.last=j;
      if(wsLoading){wsLoading=false;render()}
    }else if(!snap.metadata.fromCache){
      // nothing in the cloud for this client yet: keep local copy and store it
      if(!S){S=blankState();WS_CACHE[id]=S}
      if(wsLoading){wsLoading=false;render()}
      writer(path).push(JSON.stringify(S));
    }
  },err=>{if(id===ACTIVE){wsLoading=false;render()}});
}
async function initDb(){
  if(!(window.claude&&typeof window.claude.use==='function'))return;
  let d=null;try{d=await window.claude.use('db')}catch(e){}
  if(!d)return;
  db=d;setSync('saving','sync_conn');
  const timer=setTimeout(()=>{if(!cloud)setSync('err','sync_slow')},10000);
  let first=true;
  subs.meta=db.doc('meta/clients').onSnapshot(async snap=>{
    if(snap.metadata.fromCache&&!snap.exists)return;
    clearTimeout(timer);
    const w=writer('meta/clients');
    if(snap.exists){
      let c=null;try{c=JSON.parse(snap.data().state)}catch(e){}
      if(c&&Array.isArray(c.list)&&c.list.length){
        const j=JSON.stringify(c);
        if(j!==w.last&&!(w.writing||w.pending!=null)){w.last=j;CL=c;if(!CL.list.some(x=>x.id===ACTIVE)){ACTIVE=CL.list[0].id;S=WS_CACHE[ACTIVE]?normalize(WS_CACHE[ACTIVE]):null;wsLoading=!S}lsSave();render()}
        else w.last=j;
      }
    }else if(first){
      // first run on this artifact: migrate an old single-workspace doc if present, else upload local data
      try{const old=await db.doc('workspace/main').get();if(old.exists){const st=normalize(JSON.parse(old.data().state));if(st){const id='c'+Math.random().toString(36).slice(2,8);CL.list.unshift({id,name:t('defaultClient'),color:PALETTE[0]});WS_CACHE[id]=st}}}catch(e){}
      cloud=true;
      for(const c of CL.list){const st=WS_CACHE[c.id];if(st)writer('workspaces/'+c.id).push(JSON.stringify(st))}
      writer('meta/clients').push(JSON.stringify(CL));
    }
    if(first){first=false;cloud=true;subscribeWs(ACTIVE);if(sync.mode!=='err')setSync('cloud','sync_cloud')}
  },err=>{clearTimeout(timer);cloud=false;setSync('err','sync_off')});
}

const DOWN=()=>LANG==='en'?['Mon','Tue','Wed','Thu','Fri','Sat','Sun']:['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
function weekSlots(ws){ // ws = monday iso
  const weekPosts=S.posts.filter(p=>inRange(p.date,ws,addDays(ws,6)));
  return S.rhythm.map(r=>{
    let match;
    if(r.day>=1&&r.day<=7){const d=addDays(ws,r.day-1);match=weekPosts.find(p=>p.date===d&&(!r.format||String(p.format).toLowerCase()===String(r.format).toLowerCase()))||weekPosts.find(p=>p.date===d)}

    return {r,match,date:r.day>=1?addDays(ws,r.day-1):''};
  });
}

function pillarDist(posts){

  const none=base.filter(p=>!p.pillar||!pillar(p.pillar)).length;
  let warn='';const off=rows.filter(r=>r.target&&Math.abs(r.pct-r.target)>=10);
  if(tot&&off.length)warn=t('imbalance')+': '+off.map(r=>`${r.name} ${r.pct>r.target?t('above'):t('below')} (${r.pct}% vs ${r.target}%)`).join(' · ');

}

function calMonth(posts){
  const cur=parse(UI.cal.cursor);const first=new Date(cur.getFullYear(),cur.getMonth(),1);
  const start=startOfWeek(iso(first));const last=new Date(cur.getFullYear(),cur.getMonth()+1,0);
  const end=addDays(startOfWeek(iso(last)),6);const td=today();
  const by={};for(const p of posts)if(p.date)(by[p.date]=by[p.date]||[]).push(p);

const AD_ST=()=>[['ready',t('ad_ready')],['todo',t('ad_todo')],['ask',t('ad_ask')],['off',t('ad_off')]];
const C_ST=()=>[['planned',t('c_planned')],['live',t('c_live')],['paused',t('c_paused')],['done',t('c_done')]];
function gantt(){
  const all=[...S.paid.flatMap(c=>c.flights).filter(f=>f.start),...S.moments.filter(m=>m.start),...S.milestones.map(m=>({start:m.date,end:m.date}))];
  if(!all.length)return '';
  let a=all.reduce((x,f)=>f.start<x?f.start:x,all[0].start),b=all.reduce((x,f)=>(f.end||f.start)>x?(f.end||f.start):x,all[0].end||all[0].start);
  a=addDays(a,-2);b=addDays(b,2);const N=daysBetween(a,b);const pos=d=>((daysBetween(a,d)-1)/N*100);
  const wid=(s,e)=>(daysBetween(s,e)/N*100);
  let scale='';for(let d=a;d<=b;d=addDays(d,1)){const x=parse(d);if(x.getDate()===1||d===a||x.getDay()===1&&N<=70)scale+=`<span style="left:${pos(d)}%">${x.getDate()===1||d===a?MSHORT[LANG][x.getMonth()]+' ':''}${x.getDate()}</span>`}
  const td=today();const tdl=td>=a&&td<=b?`<div class="gtoday" style="left:${pos(td)}%"></div>`:'';
  const pbars=S.paid.flatMap(c=>c.flights).filter(f=>f.start).map(f=>`<div class="gbar paid ${f.tbd?'tbd':''}" data-band="paid" style="left:${pos(f.start)}%;width:${wid(f.start,f.end||f.start)}%" title="${esc(f.name)} · ${esc(f.focus)}">${esc(f.name)}${f.daily&&!f.tbd?` · ${f.daily}€/d`:''}</div>`).join('');
  const mbars=S.moments.filter(m=>m.start).map(m=>`<div class="gbar mom" data-band="mom" data-bref="${m.id}" style="--c:${m.color};left:${pos(m.start)}%;width:${wid(m.start,m.end||m.start)}%" title="${esc(m.name)}">${esc(m.name)}</div>`).join('');
  const ms=S.milestones.map(m=>`<div class="gms" style="left:${pos(m.date)+.5/N*100}%" title="${fmtShort(m.date)} · ${esc(m.label)}"></div>`).join('');
  return `<div class="card sec" style="padding:0;border:0"><h3 style="margin:0 0 10px">🧭 ${t('timeline')}</h3><div class="gantt"><div class="gscale">${scale}</div>

function saveDraft(){
  const d=draft;if(!d.title.trim())d.title=t('untitled');

function memberModal(id){
  const m=id?member(id):{name:'',role:''};
  openModal(`<form data-form="member" data-id="${id||''}"><div class="mh">${id?t('editOwner'):t('addOwnerT')}</div><div class="mb"><div class="fgrid">
    <div class="fld full"><label>${t('name')}</label><input class="inp" name="name" required value="${esc(m.name)}"></div>
    <div class="fld full"><label>${t('role')}</label><input class="inp" name="role" value="${esc(m.role)}" placeholder="${t('rolePh')}"></div>
  </div></div><div class="mf"><button type="button" class="btn" data-act="closeModal">${t('cancel')}</button><button class="btn pri" type="submit">${t('save')}</button></div></form>`);
}
function clientModal(id){
  const c=id?CL.list.find(x=>x.id===id):{name:'',color:PALETTE[CL.list.length%PALETTE.length]};
  openModal(`<form data-form="client" data-id="${id||''}"><div class="mh">${id?t('renameT'):t('newClientT')}</div><div class="mb"><div class="fgrid">
    <div class="fld full"><label>${t('clientName')}</label><input class="inp" name="name" required value="${esc(c.name)}"></div>
    <div class="fld full"><label>${t('color')}</label>${colorPicker(c.color)}</div>
    ${id?'':`<div class="fld full"><label>${t('startWith')}</label><div class="radio"><label><input type="radio" name="start" value="blank" checked><span>${t('startBlankO')}<small>${t('startBlankH')}</small></span></label><label><input type="radio" name="start" value="demo"><span>${t('startDemoO')}<small>${t('startDemoH')}</small></span></label></div></div>`}
  </div></div><div class="mf"><button type="button" class="btn" data-act="closeModal">${t('cancel')}</button><button class="btn pri" type="submit">${id?t('save'):t('createClient')}</button></div></form>`);
}
function showMenu(anchor,items){
  const m=$('#menu');m.innerHTML=items.map(([act,label,danger])=>`<button data-act="${act}" class="${danger?'danger':''}">${label}</button>`).join('');
  const r=anchor.getBoundingClientRect();m.style.left=Math.min(r.left,innerWidth-190)+'px';m.style.top=(r.bottom+4)+'px';m.classList.add('on');
}
const hideMenu=()=>$('#menu').classList.remove('on');
function deleteClient(){
  if(CL.list.length<=1){toast(t('lastClient'));return}
  const c=client();
  confirmModal(t('deleteClient'),t('delClientM',c.name),t('del'),async()=>{
    const id=c.id;CL.list=CL.list.filter(x=>x.id!==id);delete WS_CACHE[id];
    const nextId=CL.list[0].id;ACTIVE=null;switchClient(nextId);saveClients();
    if(db&&cloud){try{await db.doc('workspaces/'+id).delete()}catch(e){}}
    toast(t('clientDeleted'));
  },true);
}

/* ============ ACTIONS ============ */
function xList(kind,pid){if(kind==='flight'||kind==='ad'){const c=S.paid.find(x=>x.id===pid);return c?(kind==='flight'?c.flights:c.ads):null}return {mom:S.moments,ms:S.milestones,rhy:S.rhythm,camp:S.paid}[kind]}
function xSet(spec,val){const [kind,pid,rid,field]=spec.split('|');const L=xList(kind,pid);if(!L)return;const o=L.find(x=>x.id===rid);if(!o)return;
  if(field==='daily')val=Number(val)||0;if(field==='day')val=Number(val)||0;o[field]=val;
  if(field==='start'&&o.end&&o.end<val)o.end=val;save();if(field!=='notes'&&field!=='label'&&field!=='desc'&&field!=='creative')render()}
function xAdd(spec){const [kind,pid]=spec.split('|');const L=xList(kind,pid);if(!L)return;const td=today();
  const neu={flight:{id:uid('f'),name:(LANG==='en'?'Flight ':'Pantalla ')+(L.length+1),start:td,end:addDays(td,13),daily:10,focus:'',tbd:false},ad:{id:uid('a'),code:'',creative:'',dest:'',status:'todo'},ms:{id:uid('m'),date:td,label:'',kind:'organic'},mom:{id:uid('mo'),name:'',start:td,end:addDays(td,6),color:PALETTE[S.moments.length%PALETTE.length],desc:''},rhy:{id:uid('r'),day:1,format:S.lists.formats[0]||'',pillar:'',label:''}}[kind];
  L.push(neu);save();render()}
function xDel(spec){const [kind,pid,rid]=spec.split('|');const L=xList(kind,pid);if(!L)return;const i=L.findIndex(x=>x.id===rid);if(i<0)return;snapshotForUndo();L.splice(i,1);save();render();toast(t('del')+' ✓',true)}
function newCampaign(){const td=today();S.paid.push({id:uid('c'),name:LANG==='en'?'New campaign':'Nueva campaña',code:'',platform:'Meta',objective:'',optimization:'',country:'',status:'planned',notes:'',flights:[{id:uid('f'),name:LANG==='en'?'Flight 1':'Pantalla 1',start:td,end:addDays(td,13),daily:10,focus:'',tbd:false}],ads:[]});save();go('paid')}
function updatePost(id,patch,msg){const p=S.posts.find(x=>x.id===id);if(!p)return;if(patch.status==='published'&&p.status!=='published'){confetti();msg=t('published')}Object.assign(p,patch,{updatedAt:new Date().toISOString()});save();render();if(msg)toast(msg)}
function duplicate(id){const p=S.posts.find(x=>x.id===id);if(!p)return;const c=JSON.parse(JSON.stringify(p));c.id=nextId();c.title=(p.title||'')+t('copySuffix');c.status='idea';c.url='';c.demo=false;c.createdAt=c.updatedAt=new Date().toISOString();S.posts.push(c);save();render();toast(t('dupAs')+' '+c.id);return c.id}
function delPost(id){const p=S.posts.find(x=>x.id===id);if(!p)return;confirmModal(t('delT'),t('delM',p.title||p.id),t('del'),()=>{snapshotForUndo();S.posts=S.posts.filter(x=>x.id!==id);save();if(UI.drawer&&UI.drawer.id===id)closeDrawer(true);render();toast(t('deleted'),true)},true)}
function csv(){
  const cols=['id','date','time','title','description','pillar','objective','audience','channel','format','type','copy','cta','brief','reference','owner','status','asset','url','notes'];
  const head=['Client','Content ID','Publication date','Publication time','Content title','Content description','Content pillar','Marketing objective','Target audience','Channel','Format','Content type','Caption / copy','CTA','Creative brief','Reference','Responsible person','Status','Asset link','Publication URL','Notes'];
  const q=v=>{v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return [head.join(','),...sortPosts(S.posts,'date').map(p=>[q(client().name),...cols.map(c=>q(c==='pillar'?pillarName(p.pillar):c==='owner'?((member(p.owner)||{}).name||''):c==='status'?SMAP[p.status].l:p[c]))].join(','))].join('\n');
}
async function copyText(txt,msg){try{await navigator.clipboard.writeText(txt);toast(msg)}catch(e){openModal(`<div class="mh">${t('manualCopy')}</div><div class="mb">${t('manualCopyM')}<textarea class="inp" style="width:100%;min-height:200px;margin-top:8px" readonly>${esc(txt)}</textarea></div><div class="mf"><button class="btn" data-act="closeModal">${t('close')}</button></div>`)}}
function setLang(l){if(l===LANG)return;LANG=l;try{localStorage.setItem('ecm-lang',l)}catch(e){}render();if(UI.drawer)renderDrawer()}

document.addEventListener('click',e=>{
  if(!e.target.closest('#menu')&&!e.target.closest('[data-act=clientMenu]'))hideMenu();
  const el=e.target.closest('[data-layer],[data-slot],[data-band],[data-view2],[data-xadd],[data-xdel],[data-delcamp],[data-act],[data-view],[data-open],[data-dup],[data-del],[data-calmode],[data-newdate],[data-expand],[data-advance],[data-step],[data-sort],[data-editpillar],[data-delpillar],[data-filterpillar],[data-editmember],[data-delmember],[data-filterowner],[data-pscope],[data-client],[data-lang]');
  if(!el)return;
  if(e.target.closest('input,select,textarea')&&!el.matches('[data-act],[data-step]'))return;
  const ds=el.dataset;
  if(ds.act){
    const a=ds.act;hideMenu();
    if(a==='clientMenu'){e.stopPropagation();showMenu(el,[['renameClient',t('renameClient')],['askDelClient',t('deleteClient'),true]]);return}
    if(a==='renameClient'){clientModal(ACTIVE);return}
    if(a==='askDelClient'){deleteClient();return}
    if(a==='newClient'){clientModal();return}
    if(a==='kpi'){let f={};try{f=JSON.parse(ds.filt)}catch(_){}setFilters(f);if(ds.view==='calendar'){UI.cal.mode='month';UI.cal.cursor=today()}go(ds.view);return}
    if(a==='newPost'){openPost(null);return}
    if(a==='toggleSide'){$('#side').classList.toggle('open');return}
    if(a==='clearFilters'){setFilters({});render();return}
    if(a==='calPrev'||a==='calNext'){const k=a==='calPrev'?-1:1;if(UI.cal.mode==='month'){const d=parse(UI.cal.cursor);UI.cal.cursor=iso(new Date(d.getFullYear(),d.getMonth()+k,1))}else UI.cal.cursor=addDays(UI.cal.cursor,7*k);UI.cal.expanded=null;render();return}
    if(a==='calToday'){UI.cal.cursor=today();render();return}
    if(a==='goWeek'){UI.cal.mode='week';UI.cal.cursor=today();go('calendar');return}
    if(a==='toggleUnsched'){UI.showUnsched=!UI.showUnsched;render();return}
    if(a==='closeDrawer'){closeDrawer();return}
    if(a==='saveDraft'){saveDraft();return}
    if(a==='dupDraft'){if(UI.dirty){toast(t('saveFirst'));return}const nid=duplicate(UI.drawer.id);openPost(nid);return}
    if(a==='delDraft'){delPost(UI.drawer.id);return}
    if(a==='advanceDraft'){const i=SIDX[draft.status];if(i<6){draft.status=STATUSES[i+1].k;markDirty();renderDrawer()}return}
    if(a==='closeModal'){closeModal();return}
    if(a==='modalOk'){const cb=modalCb;closeModal();if(cb)cb();return}
    if(a==='undo'){if(undoStack&&undoStack.id===ACTIVE){S=normalize(JSON.parse(undoStack.j));undoStack=null;save();render();toast(t('undone'))}return}
    if(a==='newPillar'){pillarModal();return}
    if(a==='newCampaign'){newCampaign();return}
    if(a==='newMember'){memberModal();return}
    if(a==='dismissDemo'){S.isDemo=false;save();render();toast(t('hidden'));return}
    if(a==='askClearDemo'){confirmModal(t('blankT'),t('blankM'),t('startBlank'),()=>{snapshotForUndo();S=blankState(S);save();render();toast(t('blankDone'),true)},true);return}
    if(a==='askRestoreDemo'){confirmModal(t('restoreT'),t('restoreM'),t('restore'),()=>{snapshotForUndo();S=demoState(LANG);save();render();toast(t('restored'),true)},true);return}
    if(a==='copyJSON'){copyText(JSON.stringify(Object.assign({client:client().name},S),null,2),t('copiedJSON'));return}
    if(a==='copyCSV'){copyText(csv(),t('copiedCSV'));return}
    if(a==='importJSON'){const v=$('#importBox').value.trim();let st=null;try{st=normalize(JSON.parse(v))}catch(_){}if(!st){toast(t('badJSON'));return}delete st.client;confirmModal(t('importT'),t('importM'),t('import'),()=>{snapshotForUndo();S=st;save();render();toast(t('imported'),true)},true);return}
    return;
  }
  if(ds.client){switchClient(ds.client);return}
  if(ds.layer){UI.layers[ds.layer]=!UI.layers[ds.layer];render();return}
  if(ds.slot){const r=S.rhythm.find(x=>x.id===ds.slot);if(r)openPost(null,{date:ds.sdate,time:'',format:r.format,pillar:r.pillar,status:'idea',channel:S.lists.channels.includes('Instagram')?'Instagram':''});return}
  if(ds.band){if(ds.band==='paid')go('paid');else go('pillars');return}
  if(ds.view2){go(ds.view2);return}
  if(ds.xadd){xAdd(ds.xadd);return}
  if(ds.xdel){xDel(ds.xdel);return}
  if(ds.delcamp){const c=S.paid.find(x=>x.id===ds.delcamp);if(c)confirmModal(t('delCampT'),t('delCampM',c.name),t('del'),()=>{snapshotForUndo();S.paid=S.paid.filter(x=>x!==c);save();render();toast(t('del')+' ✓',true)},true);return}
  if(ds.lang){setLang(ds.lang);return}
  if(ds.view&&el.closest('.nav')){go(ds.view);return}
  if(ds.calmode){UI.cal.mode=ds.calmode;render();return}
  if(ds.newdate){openPost(null,{date:ds.newdate,time:'10:00',status:'briefing'});return}
  if(ds.expand!==undefined){UI.cal.expanded=ds.expand||null;render();return}
  if(ds.advance){const p=S.posts.find(x=>x.id===ds.advance);const i=SIDX[p.status];if(i<6)updatePost(p.id,{status:STATUSES[i+1].k},`${p.id} → ${STATUSES[i+1].l}`);return}
  if(ds.step){draft.status=ds.step;markDirty();renderDrawer();return}
  if(ds.sort){if(UI.sort.key===ds.sort)UI.sort.dir*=-1;else UI.sort={key:ds.sort,dir:1};render();return}
  if(ds.dup){duplicate(ds.dup);return}
  if(ds.del){delPost(ds.del);return}
  if(ds.editpillar){pillarModal(ds.editpillar);return}
  if(ds.delpillar){const p=pillar(ds.delpillar);const n=S.posts.filter(x=>x.pillar===p.id).length;confirmModal(t('delPillarT'),t('delPillarM',p.name,n),t('del'),()=>{snapshotForUndo();S.pillars=S.pillars.filter(x=>x.id!==p.id);S.posts.forEach(x=>{if(x.pillar===p.id)x.pillar=''});save();render();toast(t('pillarDeleted'),true)},true);return}
  if(ds.filterpillar){setFilters({pillar:ds.filterpillar});go('database');return}
  if(ds.editmember){memberModal(ds.editmember);return}
  if(ds.delmember){const m=member(ds.delmember);const n=S.posts.filter(x=>x.owner===m.id).length;confirmModal(t('delOwnerT'),t('delOwnerM',m.name,n),t('del'),()=>{snapshotForUndo();S.team=S.team.filter(x=>x.id!==m.id);S.posts.forEach(x=>{if(x.owner===m.id)x.owner=''});save();render();toast(t('ownerDeleted'),true)},true);return}
  if(ds.filterowner){setFilters({owner:ds.filterowner});go('database');return}
  if(ds.pscope){UI.pillarScope=ds.pscope;render();return}
  if(ds.open){openPost(ds.open);return}
});
$('#scrim').addEventListener('click',()=>closeDrawer());
$('#mscrim').addEventListener('click',()=>closeModal());
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){hideMenu();if($('#modal').classList.contains('on'))closeModal();else if(UI.drawer)closeDrawer();else $('#side').classList.remove('open')}
  if((e.metaKey||e.ctrlKey)&&e.key==='s'&&UI.drawer){e.preventDefault();saveDraft()}
});
let qT;
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f==='q'){UI.f.q=el.value;clearTimeout(qT);qT=setTimeout(render,150);return}
  if(el.dataset.d!==undefined&&draft){draft[el.dataset.d]=el.value;markDirty();return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.f&&el.dataset.f!=='q'){UI.f[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;render();return}
  if(el.dataset.x){xSet(el.dataset.x,el.type==='checkbox'?el.checked:el.value);return}
  if(el.dataset.dchk&&draft){draft[el.dataset.dchk]=el.checked;markDirty();renderDrawer();return}
  if(el.dataset.edit){const f=el.dataset.edit;const p=S.posts.find(x=>x.id===el.dataset.id);if(p&&p[f]!==el.value){updatePost(p.id,{[f]:el.value},f==='status'?`${p.id} → ${SMAP[el.value].l}`:f==='date'&&!el.value?t('movedIdeas'):null)}return}
  if(el.dataset.d!==undefined&&draft){draft[el.dataset.d]=el.value;markDirty();if(['date','status'].includes(el.dataset.d))renderDrawer();return}
  if(el.dataset.plan){const p=S.posts.find(x=>x.id===el.dataset.plan);if(el.value&&p)updatePost(p.id,{date:el.value,time:p.time||'10:00',status:p.status==='idea'?'briefing':p.status},t('planned',fmtShort(el.value)));return}
  if(el.dataset.act==='listSort'){UI.listSort=el.value;render();return}
  if(el.dataset.list){S.lists[el.dataset.list]=el.value.split(',').map(s=>s.trim()).filter(Boolean);save();toast(t('listUpdated'));return}
  if(el.dataset.cname!==undefined){const c=client();c.name=el.value.trim()||t('myClient');saveClients();render();return}
  if(el.name==='color'&&el.closest('form')){el.closest('form').querySelectorAll('.pcol').forEach(s=>s.style.outline='');el.nextElementSibling.style.outline='2px solid var(--tx)';el.nextElementSibling.style.outlineOffset='2px';return}
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();const fd=Object.fromEntries(new FormData(f).entries());
  if(f.dataset.form==='capture'){const title=(fd.title||'').trim();if(!title)return;const now=new Date().toISOString();S.posts.push(Object.assign({},EMPTY_POST,{id:nextId(),title,pillar:fd.pillar||'',channel:fd.channel||'',createdAt:now,updatedAt:now}));save();render();toast(t('ideaAdded'));setTimeout(()=>{const i=document.querySelector('[data-key=capt]');if(i)i.focus()},20);return}
  if(f.dataset.form==='pillar'){const id=f.dataset.id;const obj={name:fd.name.trim(),description:fd.description,objective:fd.objective,audience:fd.audience,topics:fd.topics,target:Number(fd.target)||0,color:fd.color||PALETTE[0]};if(id)Object.assign(pillar(id),obj);else S.pillars.push(Object.assign({id:uid('pl')},obj));save();closeModal();render();toast(t('pillarSaved'));return}
  if(f.dataset.form==='member'){const id=f.dataset.id;const obj={name:fd.name.trim(),role:fd.role.trim()};if(id)Object.assign(member(id),obj);else S.team.push(Object.assign({id:uid('tm')},obj));save();closeModal();render();toast(t('ownerSaved'));return}
  if(f.dataset.form==='client'){const id=f.dataset.id;const name=fd.name.trim()||t('myClient');const color=fd.color||PALETTE[0];
    if(id){Object.assign(CL.list.find(x=>x.id===id),{name,color});saveClients();closeModal();render();return}
    const nid=uid('c');CL.list.push({id:nid,name,color});const st=fd.start==='demo'?demoState(LANG):blankState();WS_CACHE[nid]=st;
    closeModal();ACTIVE_switch(nid,st);saveClients();toast(t('clientCreated'));return}
});
function ACTIVE_switch(id,st){if(UI.drawer)closeDrawer(true);ACTIVE=id;S=st;wsLoading=false;setFilters({});UI.view='overview';save();render();if(db&&cloud)subscribeWs(id)}
/* drag & drop */
let dragId=null;
document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;dragId=el.dataset.drag;try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(_){}el.style.opacity='.5'});
document.addEventListener('dragend',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(el)el.style.opacity='';document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'))});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop-date],[data-drop-status]');if(!z||!dragId)return;e.preventDefault();document.querySelectorAll('.dragover').forEach(x=>x!==z&&x.classList.remove('dragover'));z.classList.add('dragover')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop-date],[data-drop-status]');if(!z||!dragId)return;e.preventDefault();z.classList.remove('dragover');const id=dragId;dragId=null;const p=S.posts.find(x=>x.id===id);if(!p)return;
  if(z.dataset.dropStatus!==undefined){if(p.status!==z.dataset.dropStatus)updatePost(id,{status:z.dataset.dropStatus},`${id} → ${SMAP[z.dataset.dropStatus].l}`)}
  else{const d=z.dataset.dropDate;if(p.date!==d){const patch={date:d};if(d&&!p.time)patch.time='10:00';updatePost(id,patch,d?`${id} ${t('movedTo')} ${fmtShort(d)}`:`${id} ${t('movedUns')}`)}}
});
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(VIEWS.includes(h)&&h!==UI.view){UI.view=h;render()}});

/* ============ BOOT ============ */
(async function boot(){
  const ls=lsLoad();
  if(GH){
    setSync('saving','sync_ghload');
    let remote=null;try{remote=await ghFetch()}catch(e){}
    if(remote&&remote.clients&&Array.isArray(remote.clients.list)&&remote.clients.list.length){
      CL=remote.clients;WS_CACHE=remote.ws||{};
      ACTIVE=ls&&CL.list.some(c=>c.id===ls.active)?ls.active:CL.list[0].id;
      S=WS_CACHE[ACTIVE]?normalize(WS_CACHE[ACTIVE]):null;if(!S){S=blankState();WS_CACHE[ACTIVE]=S}
      const h=(location.hash||'').slice(1);if(VIEWS.includes(h))UI.view=h;
      if(ghTok())setSync('cloud','sync_gh');else setSync('local','sync_ghlocal');
      lsSave();render();return;
    }
    if(!ghTok())setSync('local','sync_ghlocal');else setSync('cloud','sync_gh');
  }
  if(ls&&ls.clients&&Array.isArray(ls.clients.list)&&ls.clients.list.length){
    CL=ls.clients;WS_CACHE=ls.ws||{};ACTIVE=CL.list.some(c=>c.id===ls.active)?ls.active:CL.list[0].id;
  }else{
    const id='c-demo';CL={list:[{id,name:t('defaultClient'),color:PALETTE[0]}]};WS_CACHE={[id]:demoState(LANG)};ACTIVE=id;
  }
  S=WS_CACHE[ACTIVE]?normalize(WS_CACHE[ACTIVE]):null;if(!S){S=blankState();WS_CACHE[ACTIVE]=S}
  const h=(location.hash||'').slice(1);if(VIEWS.includes(h))UI.view=h;
  render();initDb();
})();

</script>
