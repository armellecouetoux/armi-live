<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<style id="page-style">
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
/* Layout: tabs per client on top; each panel is one column on black, a date rail on the left, event + tasks on the right. Hover the event name to see its landing. */
:root{
  --bg:#0A0A0B; --surface:#16161A; --surface-2:#1E1E23; --ink:#F5F5F0; --muted:#A4A4AB; --line:#2A2A30;
  --accent:#AAB6FF; --accent-soft:rgba(170,182,255,.14); --orb-a:#4C5BD4; --orb-b:#8A4B2E; --glow:rgba(170,182,255,.06); --urgent:#FFB48C; --urgent-soft:rgba(255,180,140,.14); --done:#6E6E76;
  --f-display:"Manrope", Arial, Helvetica, sans-serif;
  --f-body:"Manrope", Arial, Helvetica, sans-serif;
  --f-mono:"Manrope", Arial, Helvetica, sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55; padding-inline:20px; padding-block:56px 72px; position:relative; overflow-x:hidden}
body::before, body::after{transition:background .8s; content:""; position:fixed; z-index:0; pointer-events:none; border-radius:50%; filter:blur(80px); opacity:.35}
body::before{width:520px; height:520px; top:-180px; right:-160px; background:radial-gradient(circle, var(--orb-a) 0%, transparent 70%); animation:drift 18s ease-in-out infinite alternate}
body::after{width:420px; height:420px; bottom:-200px; left:-140px; background:radial-gradient(circle, var(--orb-b) 0%, transparent 70%); animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0) scale(1)} to{transform:translate(-60px,50px) scale(1.15)}}

.page{max-width:820px; margin:0 auto; display:grid; gap:44px; position:relative; z-index:1}

@keyframes rise{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)}}

header{display:grid; gap:16px}
header > *{animation:rise .8s var(--ease) both}
header > :nth-child(2){animation-delay:.08s}
header > :nth-child(3){animation-delay:.16s}
header > :nth-child(4){animation-delay:.24s}
header > :nth-child(5){animation-delay:.32s}
.eyebrow{font-family:var(--f-mono); font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 14px}
h1{font-family:var(--f-display); font-weight:800; font-size:clamp(36px,6.4vw,60px); line-height:1.02; letter-spacing:-.035em; margin:0; text-wrap:balance}
h1 em{font-style:normal; background:linear-gradient(90deg, var(--ink) 0%, var(--accent) 50%, var(--ink) 100%); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.lede{margin:0; color:var(--muted); max-width:58ch}
.lede b{color:var(--ink); font-weight:700}

.summary{display:flex; flex-wrap:wrap; gap:10px}
.pill{font-family:var(--f-mono); font-size:12px; font-weight:500; padding:6px 12px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font-variant-numeric:tabular-nums}
.pill strong{font-weight:700; color:var(--accent)}

.progress{height:4px; border-radius:4px; background:var(--line); overflow:hidden; max-width:420px}
.progress i{display:block; height:100%; width:0; border-radius:4px; background:linear-gradient(90deg, var(--accent), var(--ink)); transition:width .9s var(--ease)}

ol.timeline{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.row{display:grid; grid-template-columns:112px minmax(0,1fr); gap:24px; padding-block:28px; border-bottom:1px solid var(--line); position:relative; animation:rise .8s var(--ease) both}
.row:nth-child(1){animation-delay:.35s} .row:nth-child(2){animation-delay:.45s} .row:nth-child(3){animation-delay:.55s} .row:nth-child(4){animation-delay:.65s} .row:nth-child(5){animation-delay:.75s} .row:nth-child(6){animation-delay:.85s}
.row::before{content:""; position:absolute; left:-20px; right:-20px; top:0; bottom:0; background:linear-gradient(90deg, var(--glow), transparent 70%); opacity:0; transition:opacity .35s var(--ease); pointer-events:none; border-radius:6px}
.row:hover::before{opacity:1}
.date{display:grid; align-content:start; gap:6px}
.date .d{font-family:var(--f-display); font-weight:800; font-size:36px; line-height:1; letter-spacing:-.04em; font-variant-numeric:tabular-nums; transition:transform .35s var(--ease), color .35s}
.row:hover .date .d{transform:translateX(4px); color:var(--accent)}
.date .m{font-family:var(--f-mono); font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.chip{justify-self:start; display:inline-flex; align-items:center; gap:6px; font-family:var(--f-mono); font-size:11px; font-weight:600; padding:3px 8px; border-radius:4px; background:var(--accent-soft); color:var(--accent); font-variant-numeric:tabular-nums}
.chip.soon{background:var(--urgent-soft); color:var(--urgent)}
.chip.past{background:transparent; color:var(--done); padding-left:0}
.row.next .chip::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor} 70%{box-shadow:0 0 0 7px transparent} 100%{box-shadow:0 0 0 0 transparent}}

.body{display:grid; gap:12px; min-width:0}
.meta{font-family:var(--f-mono); font-size:12px; font-weight:500; color:var(--muted)}

/* Event name: linked when it has a landing */
.ev{position:relative; justify-self:start; max-width:100%}
.ev-name{font-family:var(--f-display); font-weight:700; font-size:25px; line-height:1.15; letter-spacing:-.02em; color:var(--ink); text-decoration:none}
a.ev-name{text-decoration:underline; text-decoration-color:var(--line); text-decoration-thickness:2px; text-underline-offset:6px; transition:color .25s, text-decoration-color .25s}
a.ev-name:hover, a.ev-name:focus-visible{color:var(--accent); text-decoration-color:var(--accent); outline:none}
a.ev-name::after{content:"↗"; display:inline-block; margin-left:6px; font-size:.62em; color:var(--accent); vertical-align:.3em; text-decoration:none; transition:transform .3s var(--ease)}
a.ev-name:hover::after{transform:translate(3px,-3px); color:var(--accent)}
.tlink{font-size:12px; font-weight:700; color:var(--accent); text-decoration:none; margin-left:6px; white-space:nowrap}
.tlink:hover{text-decoration:underline}


/* Client themes: each tab carries its own accent */
body.c-shopify{--accent:#8EE6B4; --accent-soft:rgba(142,230,180,.14); --orb-a:#1E8A55; --orb-b:#5C6B1E; --glow:rgba(142,230,180,.07)}
body.c-rocket{--accent:#AAB6FF; --accent-soft:rgba(170,182,255,.14); --orb-a:#4C5BD4; --orb-b:#8A4B2E; --glow:rgba(170,182,255,.06)}

/* Tabs */
.tabs{display:flex; flex-wrap:wrap; gap:4px; padding:4px; border:1px solid var(--line); border-radius:999px; background:var(--surface); justify-self:start; position:relative; animation:rise .7s var(--ease) both}
.tab{appearance:none; border:0; background:transparent; color:var(--muted); font-family:var(--f-body); font-size:13px; font-weight:700; padding:8px 16px; border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:color .25s, background .35s var(--ease)}
.tab::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--dot); opacity:.55; transition:opacity .25s, transform .35s var(--ease)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--bg); background:var(--dot)}
.tab[aria-selected="true"]::before{background:var(--bg); opacity:1; transform:scale(1.2)}
.tab:focus-visible{outline:2px solid var(--dot); outline-offset:2px}
.tab[data-tab="rocket"]{--dot:#AAB6FF}
.tab[data-tab="shopify"]{--dot:#8EE6B4}
.panel{display:grid; gap:44px}

[hidden]{display:none!important}
/* Sync */
.syncbar{display:inline-flex; flex-wrap:wrap; align-items:center; gap:10px}
.syncbtn{appearance:none; border:1px solid var(--line); background:transparent; color:var(--muted); font-family:var(--f-body); font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; cursor:pointer}
.syncbtn:hover{color:var(--accent); border-color:var(--accent)}
.status.ok{color:#8EE6B4}
.syncpanel{border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:20px; display:grid; gap:12px; font-size:14px; color:var(--muted); animation:rise .4s var(--ease) both}
.syncpanel p, .syncpanel ol{margin:0} .syncpanel ol{padding-left:20px; display:grid; gap:4px}
.syncpanel b{color:var(--ink)} .syncpanel a{color:var(--accent)} .syncpanel code{color:var(--ink)}

/* Add / delete tasks */
.addtask{justify-self:start; appearance:none; border:1px dashed var(--line); background:transparent; color:var(--muted); font-family:var(--f-body); font-size:12px; font-weight:700; padding:5px 12px; border-radius:999px; cursor:pointer; margin-left:29px; transition:color .2s, border-color .2s}
.addtask:hover, .addtask:focus-visible{color:var(--accent); border-color:var(--accent); outline:none}
.body > .lform{padding-left:29px}
.deltask{align-self:center; appearance:none; border:0; background:transparent; color:var(--done); font-family:var(--f-body); font-size:14px; font-weight:700; line-height:1; padding:3px 6px; border-radius:6px; cursor:pointer; opacity:0; transition:opacity .2s, color .2s, background .2s}
.task:hover .deltask, .deltask:focus-visible, .deltask.armed{opacity:1}
.deltask:hover{color:var(--urgent)}
.deltask.armed{font-size:11px; color:var(--bg); background:var(--urgent)}
@media (hover:none){ .deltask{opacity:1} }
.readonly .addtask, .readonly .deltask{display:none}

/* Meeting notes */
.notes{border-top:1px solid var(--line); padding-top:28px}
.note-list{display:grid; gap:12px}
.note{border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:14px 16px; display:grid; gap:8px; animation:rise .4s var(--ease) both; transition:border-color .25s}
.note:focus-within{border-color:var(--accent)}
.note-head{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center}
.note-date, .note-title, .note-body{background:transparent; border:0; color:var(--ink); font-family:var(--f-body); outline:none; min-width:0}
.note-date{font-size:12px; font-weight:700; color:var(--accent); color-scheme:dark; padding:4px 0}
.note-title{font-size:16px; font-weight:700; padding:4px 0}
.note-title::placeholder, .note-body::placeholder{color:var(--done)}
.note-body{font-size:14px; line-height:1.6; resize:none; min-height:96px; width:100%; overflow:hidden; border-top:1px solid var(--line); padding-top:10px}
.note-meta{font-size:11px; color:var(--done)}
.readonly .note input, .readonly .note textarea{pointer-events:none}
@media (max-width:560px){ .note-head{grid-template-columns:1fr auto} .note-title{grid-column:1 / -1; grid-row:2} }

.ro-badge{margin-left:6px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--ink); letter-spacing:.06em}
.readonly .task label, .readonly .task input{cursor:default}
.readonly .st{appearance:none; -webkit-appearance:none; background-image:none; padding-right:9px}

/* Share with client */
.sharewrap{display:grid; gap:10px; justify-items:start}
.sharebtn{appearance:none; display:inline-flex; align-items:center; gap:8px; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent); font-family:var(--f-body); font-size:13px; font-weight:700; padding:8px 14px; border-radius:999px; cursor:pointer; transition:background .2s, color .2s}
.sharebtn::before{content:"↗"; font-size:12px}
.sharebtn:hover, .sharebtn[aria-expanded="true"]{background:var(--accent); color:var(--bg)}
.sharebtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.sharepop{border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:16px; display:grid; gap:10px; width:min(520px, 100%); animation:rise .3s var(--ease) both}
.sp-t{margin:0; font-weight:700; color:var(--ink)} .sp-d{margin:0; font-size:13px; color:var(--muted)}
.sp-row{display:flex; gap:8px}
.sp-url{flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--ink); font-family:var(--f-body); font-size:13px; padding:8px 10px}
.sp-copy{appearance:none; border:0; border-radius:8px; background:var(--accent); color:var(--bg); font-family:var(--f-body); font-size:12px; font-weight:700; padding:8px 14px; cursor:pointer; white-space:nowrap}
.sp-acts{display:flex; flex-wrap:wrap; gap:14px} .sp-acts a{font-size:12.5px; font-weight:700; color:var(--accent); text-decoration:none} .sp-acts a:hover{text-decoration:underline}

/* Background halo: slow rotating aurora + a glow that follows the cursor */
.aura{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.aura-ring{position:absolute; left:50%; top:-35vmax; width:110vmax; height:110vmax; margin-left:-55vmax; border-radius:50%;
  background:conic-gradient(from 0deg, var(--orb-a), transparent 22%, var(--accent) 40%, transparent 58%, var(--orb-b) 76%, transparent 90%, var(--orb-a));
  -webkit-mask:radial-gradient(circle, transparent 38%, #000 52%, transparent 70%); mask:radial-gradient(circle, transparent 38%, #000 52%, transparent 70%);
  filter:blur(55px); opacity:.34; animation:auraSpin 48s linear infinite, auraBreath 9s ease-in-out infinite alternate; transition:background .8s}
.aura-glow{position:absolute; left:0; top:0; width:560px; height:560px; margin:-280px 0 0 -280px; border-radius:50%;
  background:radial-gradient(circle, var(--accent) 0%, transparent 62%); opacity:.18; filter:blur(30px); will-change:transform; animation:glowPulse 6s ease-in-out infinite alternate}
.aura-grain{position:absolute; inset:-50%; background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px); background-size:3px 3px; animation:grain 1.2s steps(4) infinite; opacity:.5}
@keyframes auraSpin{to{transform:rotate(360deg)}}
@keyframes auraBreath{from{opacity:.26} to{opacity:.44}}
@keyframes glowPulse{from{opacity:.13} to{opacity:.22}}
@keyframes grain{0%{transform:translate(0,0)} 25%{transform:translate(-1%,1%)} 50%{transform:translate(1%,-1%)} 75%{transform:translate(-1%,-1%)} 100%{transform:translate(1%,1%)}}
@media (max-width:560px){ .aura-glow{width:340px; height:340px; margin:-170px 0 0 -170px} }
@media (prefers-reduced-motion:reduce){ .aura-glow{display:none} }

/* Edit / reorder tasks */
.drag{align-self:center; color:var(--done); font-size:12px; letter-spacing:-2px; cursor:grab; user-select:none; padding:0 2px; opacity:0; transition:opacity .2s}
.no-sortable .drag{display:none}
.task:hover .drag{opacity:1}
.drag-ghost{opacity:.35}
.edittask, .mv{align-self:center; appearance:none; border:0; background:transparent; color:var(--done); font-family:var(--f-body); font-size:13px; line-height:1; padding:3px 5px; border-radius:6px; cursor:pointer; opacity:0; transition:opacity .2s, color .2s}
.movebtns{display:inline-flex; align-self:center}
.task:hover .edittask, .task:hover .mv, .edittask:focus-visible, .mv:focus-visible{opacity:1}
.edittask:hover, .mv:hover{color:var(--accent)}
@media (hover:none){ .edittask, .mv{opacity:1} .drag{display:none} }
@media (hover:hover){ .movebtns{display:none} .no-sortable .movebtns{display:inline-flex} }
.editform{padding-left:29px}
/* Notes shared with the client */
.note-head{grid-template-columns:auto minmax(0,1fr) auto auto}
.note-share{appearance:none; border:1px solid var(--line); background:transparent; color:var(--muted); font-family:var(--f-body); font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; cursor:pointer; white-space:nowrap}
.note-share.on{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.note.is-shared{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.note.ro .note-head{grid-template-columns:auto minmax(0,1fr)}
.note-body.ro{white-space:pre-wrap; min-height:0; overflow:visible}
@media (max-width:560px){ .note-head{grid-template-columns:1fr auto auto} }

/* Home */
body.c-home{--accent:#F0D88A; --accent-soft:rgba(240,216,138,.14); --orb-a:#6A55C9; --orb-b:#A0672A; --glow:rgba(240,216,138,.06)}
.tab[data-tab="home"]{--dot:#F0D88A}
h2{font-family:var(--f-display); font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0}
.h-section{display:grid; gap:14px; align-content:start; min-width:0; animation:rise .8s var(--ease) both}
.h-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:28px}
.h-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.fresh{font-size:11px; color:var(--done)}
.kpis{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; animation:rise .8s var(--ease) .15s both}
.kpi{border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--surface); display:grid; gap:4px}
.kpi b{font-family:var(--f-display); font-size:34px; font-weight:800; letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums}
.kpi span{font-size:12px; color:var(--muted); font-weight:600}
.kpi.warm b{color:#FF9E7A}
.clients{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px}
.ccard{appearance:none; text-align:left; font:inherit; color:var(--ink); border:1px solid var(--line); border-radius:14px; padding:18px; background:var(--surface); display:grid; gap:10px; cursor:pointer; position:relative; overflow:hidden; transition:transform .35s var(--ease), border-color .3s}
.ccard::before{content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--c)}
.ccard:hover{transform:translateY(-3px); border-color:var(--c)}
.ccard:focus-visible{outline:2px solid var(--c); outline-offset:2px}
.ccard .nm{font-family:var(--f-display); font-size:20px; font-weight:800; letter-spacing:-.02em}
.ccard .ln{font-size:13px; color:var(--muted)}
.ccard .ln strong{color:var(--ink)}
.ccard .pb{height:4px; border-radius:4px; background:var(--line); overflow:hidden}
.ccard .pb i{display:block; height:100%; background:var(--c); width:0; transition:width 1s var(--ease)}
.ccard .go2{font-size:12px; font-weight:700; color:var(--c)}
.upcoming, .focus{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.upcoming li, .focus li{display:grid; grid-template-columns:92px minmax(0,1fr) auto; gap:12px; align-items:baseline; padding:10px 0; border-bottom:1px solid var(--line)}
.focus li{grid-template-columns:10px minmax(0,1fr) auto}
.upcoming .dd{white-space:nowrap; font-family:var(--f-display); font-weight:800; font-size:17px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.upcoming .nm, .focus .nm{font-weight:600; min-width:0}
.upcoming .cl, .focus .cl{font-size:11px; font-weight:700; color:var(--c)}
.linkbtn{appearance:none; border:0; background:transparent; color:inherit; font:inherit; padding:0; text-align:left; cursor:pointer}
.linkbtn:hover{color:var(--accent)}
.dot{width:8px; height:8px; border-radius:50%; background:var(--c); align-self:center}
.dot.ongoing{background:#8FC7FF} .dot.priority{background:#FF9E7A}
.feed{display:grid; gap:2px}
.feed .day{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding-top:12px}
.feed .day:first-child{padding-top:0}
.feed a.it{display:grid; grid-template-columns:78px minmax(0,1fr); gap:12px; padding:9px 0; border-bottom:1px solid var(--line); color:var(--ink); text-decoration:none; transition:background .25s}
.feed a.it:hover .t1{color:var(--accent)}
.feed .tm{font-size:12px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums}
.feed .t1{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:color .2s}
.feed .t2{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.feed .tg{display:inline-block; font-size:10.5px; font-weight:700; padding:0 6px; border-radius:4px; margin-left:6px; color:var(--bg); background:var(--c)}
.feed .unread .t1::before{content:"● "; color:var(--accent); font-size:9px; vertical-align:2px}
.empty{font-size:13px; color:var(--muted); margin:0}
.empty.warn{color:var(--urgent)}
.live[hidden]{display:none}
@media (max-width:760px){ .h-grid{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(2, minmax(0,1fr))} }

/* Task status */
.tline{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; align-items:start}
.task label .txt{justify-self:start}

.st.v-done{color:#8EE6B4; border-color:rgba(142,230,180,.45); background-color:rgba(142,230,180,.10)}
.task.is-priority .txt{font-weight:700}

.task.is-canceled .txt{color:var(--done); text-decoration:line-through dashed; background-size:0 0}

/* Task links added by people */
.task{display:grid; gap:6px}
.task .extras{display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding-left:29px}
.lchip{display:inline-flex; align-items:center; gap:2px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font-size:12px; font-weight:600; max-width:100%; animation:rise .35s var(--ease) both}
.lchip a{color:var(--accent); text-decoration:none; padding:3px 4px 3px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px}

.addlink{align-self:center; appearance:none; border:1px dashed var(--line); background:transparent; color:var(--muted); font-family:var(--f-body); font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; cursor:pointer; opacity:0; transition:opacity .2s, color .2s, border-color .2s}
.task:hover .addlink, .task:focus-within .addlink, .addlink.has{opacity:1}
.addlink:hover{color:var(--accent); border-color:var(--accent)}
.addlink:focus-visible{opacity:1; outline:2px solid var(--accent); outline-offset:2px}
@media (hover:none){.addlink{opacity:1}}
.lform{display:flex; flex-wrap:wrap; gap:6px; width:100%; animation:rise .3s var(--ease) both}

.lform button{appearance:none; border:0; border-radius:8px; font-family:var(--f-body); font-size:12px; font-weight:700; padding:7px 12px; cursor:pointer}
.lform .ok{background:var(--accent); color:var(--bg)}
.lform .cancel{background:transparent; color:var(--muted)}
.lform .err{flex-basis:100%; font-size:12px; color:var(--urgent)}
.readonly .addlink, .readonly .lchip button{display:none}

/* Tasks */
ul.tasks{list-style:none; margin:0; padding:0; display:grid; gap:9px}

.task input:checked{background:var(--accent); border-color:var(--accent); animation:pop .35s var(--ease)}
.task input:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
@keyframes pop{50%{transform:scale(1.25)}}
.task input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.task .txt{background-image:linear-gradient(var(--done),var(--done)); background-size:0% 1.5px; background-repeat:no-repeat; background-position:0 55%; transition:background-size .4s var(--ease), color .3s}

.note{font-size:13px; color:var(--muted); margin-top:2px; display:block}

.status{font-size:12px; color:var(--muted)}
.status.err{color:var(--urgent)}
footer{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; animation:rise .8s var(--ease) .95s both}

@media (max-width:560px){

      card.querySelector('.note-title').focus(); scheduleSave();
    });
  });


  // ---------- Home: overview of every client ----------
  var CL = {};
  state.clients.forEach(function(c){ CL[c.key] = {name: c.name, c: c.c}; });
  var dfmt = new Intl.DateTimeFormat('es-ES',{day:'2-digit', month:'short'});
  var h = now.getHours();
  var helloEl = document.getElementById('hello'); if (helloEl) helloEl.innerHTML = (h < 6 ? 'Buenas noches' : h < 14 ? 'Buenos días' : h < 21 ? 'Buenas tardes' : 'Buenas noches') + ', <em>Armi</em>';
  function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function goTo(client, target){
    showTab(client, true);
    if (target){ var t = document.getElementById(target); if (t){ var li = t.closest('li'); setTimeout(function(){ li.scrollIntoView({behavior:'smooth', block:'center'}); }, 60); } }
    else window.scrollTo({top:0, behavior:'smooth'});
  }

  function renderHome(quiet){
    var tOpen = 0, tPrio = 0, events = [], focus = [];
    var clients = document.getElementById('clients'); clients.innerHTML = '';
    panels.forEach(function(panel){
      var key = panel.dataset.client, info = CL[key] || {name:key, c:'#ccc'}, c = counts(panel);
      tOpen += c.open; tPrio += c.prio;
      var pct = c.total ? Math.round((c.total - c.open) / c.total * 100) : 0;
      var card = el('button','ccard'); card.type = 'button'; card.style.setProperty('--c', info.c);
      card.appendChild(el('span','nm', info.name));
      var ln = el('span','ln'); ln.innerHTML = '<strong>' + c.open + '</strong> de ' + c.total + ' tareas abiertas' + (c.prio ? ' · <strong style="color:#FF9E7A">' + c.prio + '</strong> prioritarias' : ''); card.appendChild(ln);
      var pb = el('span','pb'); var pbi = el('i'); pb.appendChild(pbi); card.appendChild(pb);
      var nx = panel._next; card.appendChild(el('span','ln', nx ? 'Próxima: ' + nx.name + ' · ' + (nx.diff === 0 ? 'hoy' : 'en ' + nx.diff + ' d') : 'Sin activaciones próximas'));
      card.appendChild(el('span','go2','Abrir →'));
      card.addEventListener('click', function(){ goTo(key); });
      clients.appendChild(card);
      requestAnimationFrame(function(){ setTimeout(function(){ pbi.style.width = Math.max(pct, 2) + '%'; }, quiet ? 0 : 400); });

      panel.querySelectorAll('.row').forEach(function(r){
        var p = r.dataset.date.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]);
        if (d >= today) events.push({d:d, name:r.querySelector('.ev-name').textContent.trim(), key:key, when:r.querySelector('.date .d').textContent + ' ' + r.querySelector('.date .m').textContent.split('·')[0].trim()});
      });
      panel.querySelectorAll('li.task').forEach(function(li){
        var cb = li.querySelector('input[type=checkbox]'), v = statusOf(cb.id);
        if (v === 'priority' || v === 'ongoing'){
          var row = li.closest('.row');
          focus.push({v:v, id:cb.id, key:key, txt:li.querySelector('.txt').firstChild.textContent.trim(), ev:row ? row.querySelector('.ev-name').textContent.trim() : ''});
        }
      });
    });
    events.sort(function(a,b){ return a.d - b.d; });
    focus.sort(function(a,b){ return (a.v === 'priority' ? 0 : 1) - (b.v === 'priority' ? 0 : 1); });

    var k = document.getElementById('kpis'); k.innerHTML = '';
    function kpi(n, label, cls){ var d = el('div','kpi' + (cls ? ' ' + cls : '')); d.appendChild(el('b', null, String(n))); d.appendChild(el('span', null, label)); k.appendChild(d); }
    var nextEv = events[0], nd = nextEv ? Math.round((nextEv.d - today)/MS) : null;
    kpi(panels.length, 'clientes activos');
    kpi(tOpen, 'tareas abiertas');
    kpi(tPrio, tPrio === 1 ? 'prioritaria' : 'prioritarias', tPrio ? 'warm' : '');
    kpi(nextEv ? (nd === 0 ? 'Hoy' : nd + ' d') : '—', nextEv ? 'hasta ' + nextEv.name : 'sin activaciones');

    var up = document.getElementById('upcoming'); up.innerHTML = '';
    events.slice(0, 7).forEach(function(e){
      var li = el('li'); li.style.setProperty('--c', CL[e.key].c);
      li.appendChild(el('span','dd', e.when));
      var b = el('button','linkbtn nm', e.name); b.type = 'button'; b.addEventListener('click', function(){ goTo(e.key); }); li.appendChild(b);
      li.appendChild(el('span','cl', CL[e.key].name));
      up.appendChild(li);
    });
    if (!events.length) up.appendChild(el('li','empty','No hay activaciones próximas.'));

    var fo = document.getElementById('focus'); fo.innerHTML = '';
    focus.slice(0, 10).forEach(function(f){
      var li = el('li'); li.style.setProperty('--c', CL[f.key].c);
      li.appendChild(el('span','dot ' + f.v));
      var b = el('button','linkbtn nm', f.txt); b.type = 'button'; b.title = f.ev; b.addEventListener('click', function(){ goTo(f.key, f.id); }); li.appendChild(b);
      li.appendChild(el('span','cl', CL[f.key].name));
      fo.appendChild(li);
    });
    if (!focus.length){ var li = el('li'); li.style.gridTemplateColumns = '1fr'; li.appendChild(el('span','empty','Marca tareas como Prioritario u On going y aparecerán aquí.')); fo.appendChild(li); }
  }


  // ---------- Share button per client tab ----------
  var SHARE_BASE = 'https://armellecouetoux.github.io/armi-live/';
  if (!VIEW) panels.forEach(function(panel){
    var client = panel.dataset.client, code = SHARES[client]; if (!code) return;
    var url = SHARE_BASE + code + '/', name = (CL[client] || {}).name || client;
    var head = panel.querySelector('header'), wrap = el('div','sharewrap');
    var btn = el('button','sharebtn','Compartir con el cliente'); btn.type = 'button'; btn.setAttribute('aria-expanded','false');
    var pop = el('div','sharepop'); pop.hidden = true;
    pop.appendChild(el('p','sp-t','Enlace de solo lectura para ' + name));
    pop.appendChild(el('p','sp-d','Muestra solo esta pestaña, sin notas ni otras pestañas, y se actualiza cuando guardas cambios.'));
    var row = el('div','sp-row');
    var inp = el('input','sp-url'); inp.type = 'text'; inp.readOnly = true; inp.value = url; inp.id = 'share-' + client; inp.setAttribute('aria-label','Enlace para compartir');
    var copy = el('button','sp-copy','Copiar'); copy.type = 'button';
    row.append(inp, copy); pop.appendChild(row);
    var acts = el('div','sp-acts');
    var msg = 'Hola, aquí tenéis la agenda y el estado de las tareas de ' + name + ', se actualiza en tiempo real: ' + url;
    [['Abrir vista ↗', url], ['WhatsApp ↗', 'https://wa.me/?text=' + encodeURIComponent(msg)], ['Email ↗', 'mailto:?subject=' + encodeURIComponent('Agenda ' + name) + '&body=' + encodeURIComponent(msg)]]
      .forEach(function(a){ var l = el('a', null, a[0]); l.href = a[1]; l.target = '_blank'; l.rel = 'noopener'; acts.appendChild(l); });
    pop.appendChild(acts);
    wrap.append(btn, pop); head.appendChild(wrap);
    btn.addEventListener('click', function(){ pop.hidden = !pop.hidden; btn.setAttribute('aria-expanded', String(!pop.hidden)); if (!pop.hidden) inp.select(); });
    copy.addEventListener('click', function(){
      function done(){ copy.textContent = 'Copiado ✓'; setTimeout(function(){ copy.textContent = 'Copiar'; }, 1800); }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function(){ inp.select(); document.execCommand && document.execCommand('copy'); done(); });
      else { inp.select(); try { document.execCommand('copy'); } catch(e){} done(); }
    });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !pop.hidden){ pop.hidden = true; btn.setAttribute('aria-expanded','false'); btn.focus(); } });
  });

  // ---------- Background halo ----------
  (function(){
    var aura = document.createElement('div'); aura.className = 'aura'; aura.setAttribute('aria-hidden','true');
    aura.innerHTML = '<div class="aura-ring"></div><div class="aura-glow"></div><div class="aura-grain"></div>';
    document.body.insertBefore(aura, document.body.firstChild);
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var glow = aura.querySelector('.aura-glow');
    var x = innerWidth * .7, y = innerHeight * .25, tx = x, ty = y, last = 0, t0 = performance.now();
    addEventListener('pointermove', function(e){ tx = e.clientX; ty = e.clientY; last = performance.now(); }, {passive:true});
    function tick(now){
      if (now - last > 2500){ // idle or touch: drift on a slow figure-eight
        var t = (now - t0) / 1000;
        tx = innerWidth * (.5 + .32 * Math.sin(t * .23)); ty = innerHeight * (.42 + .25 * Math.sin(t * .37 + 1));
      }
      x += (tx - x) * .06; y += (ty - y) * .06;
      glow.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  function counts(panel){
    var bx = panel.querySelectorAll('.task input[type=checkbox]'), open = 0, total = 0, prio = 0;
    bx.forEach(function(b){
      var v = statusOf(b.id); if (v === 'canceled') return;
      total++; if (!b.checked) open++; if (v === 'priority') prio++;
    });
    return {open: open, total: total, prio: prio};
  }
  function fillProgress(panel){
    var c = counts(panel), bar = panel.querySelector('.progress i');
    var pct = c.total ? Math.round((c.total - c.open) / c.total * 100) : 0;
    bar.style.width = '0%';
    requestAnimationFrame(function(){ setTimeout(function(){ bar.style.width = Math.max(pct, 2) + '%'; }, 450); });
  }
  function summary(panel){
    var c = counts(panel), s = panel.querySelector('.summary'), next = panel._next;
    s.innerHTML = '';
    function pill(html){ var e = document.createElement('span'); e.className = 'pill'; e.innerHTML = html; s.appendChild(e); }
    pill('<strong>' + panel._rows + '</strong> ' + (panel._rows === 1 ? 'activación' : 'activaciones'));
    pill('<strong>' + c.open + '</strong> de ' + c.total + ' tareas abiertas');
    if (c.prio) pill('<strong style="color:#FF9E7A">' + c.prio + '</strong> ' + (c.prio === 1 ? 'prioritaria' : 'prioritarias'));
    if (next) pill('Próxima: ' + next.name + ' · <strong>' + (next.diff === 0 ? 'hoy' : 'en ' + next.diff + ' d') + '</strong>');
    if (!panel.hidden){
      var bar = panel.querySelector('.progress i');
      bar.style.width = Math.max(c.total ? Math.round((c.total - c.open) / c.total * 100) : 0, 2) + '%';
    }
  }
  panels.forEach(summary);

  var start = VIEW ? '' : (location.hash || '').replace('#','');
  if (!start){ try { start = localStorage.getItem('armi-tab') || ''; } catch(e){} }

  // ---------- Add clients and activations (owner only) ----------
  async function saveNow(){
    clearTimeout(timer);
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
    if (!token()) return false;
    pending = true; setStatus('Guardando…');
    try { await pushRemote(false); await sharing; pending = false; return true; }
    catch(e){ pending = false; setStatus('No se pudo sincronizar con GitHub. Inténtalo de nuevo.', true); return false; }
  }
  async function putViewer(c){
    var r = await fetch(GH_BASE + '_tools/viewer.html?ref=main&t=' + Date.now(), {headers: ghHeaders(), cache: 'no-store'});
    if (!r.ok) throw 0;
    var html = b64dec((await r.json()).content);
    html = html.replace('/*ARMI_VIEW_INIT*/', 'window.ARMI_VIEW = ' + JSON.stringify(c.key) + '; window.ARMI_DATA = ' + JSON.stringify(c.code + '/data.json') + ';')
               .replace('<title>Agenda</title>', '<title>Agenda</title>');
    await putFile(c.code + '/index.html', html, false);
    await putFile(c.code + '/data.json', shareData(c.key) || {clients: [{key: c.key, name: c.name, c: c.c}]}, false);
  }
  function rid(n){ var a = 'abcdefghijklmnopqrstuvwxyz0123456789', s = ''; var b = new Uint8Array(n); crypto.getRandomValues(b); b.forEach(function(x){ s += a[x % a.length]; }); return s; }
  function slug(t){ return (t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 20) || 'cliente'; }
  function needToken(where){ if (token()) return false; setStatus('Conecta GitHub en "Sincronizar dispositivos" para ' + where + '.', true); document.getElementById('status').scrollIntoView({behavior:'smooth', block:'center'}); return true; }
  function goReload(tab){ try { localStorage.setItem('armi-tab', tab); } catch(e){} location.reload(); }

  if (!VIEW) (function(){
    var nav = document.querySelector('.tabs'); if (!nav) return;
    // New client
    var add = el('button','tab tab-add','+ Cliente'); add.type = 'button'; add.setAttribute('aria-label','Añadir cliente'); nav.appendChild(add);
    var box = el('form','newclient lform'); box.hidden = true; nav.parentNode.insertBefore(box, nav.nextSibling);
    var nm = el('input'); nm.type = 'text'; nm.id = 'nc-name'; nm.placeholder = 'Nombre del cliente'; nm.maxLength = 40; nm.setAttribute('aria-label','Nombre del cliente');
    var sw = el('div','swatches'), used = state.clients.map(function(c){ return c.c; }), pick = PALETTE.filter(function(c){ return used.indexOf(c) < 0; })[0] || PALETTE[0];
    PALETTE.forEach(function(c, i){ var b = el('button','sw'); b.type = 'button'; b.style.background = c; b.setAttribute('aria-label','Color ' + (i + 1)); if (c === pick) b.classList.add('on'); b.addEventListener('click', function(){ pick = c; sw.querySelectorAll('.sw').forEach(function(x){ x.classList.toggle('on', x === b); }); }); sw.appendChild(b); });
    var ok = el('button','ok','Crear cliente'); ok.type = 'submit';
    var no = el('button','cancel','Cancelar'); no.type = 'button';
    var er = el('span','err'); er.hidden = true;
    box.append(nm, sw, ok, no, er);
    add.addEventListener('click', function(){ box.hidden = !box.hidden; if (!box.hidden) nm.focus(); });
    no.addEventListener('click', function(){ box.hidden = true; });
    box.addEventListener('submit', async function(e){
      e.preventDefault();
      var name = nm.value.trim(); if (!name){ nm.focus(); return; }
      if (needToken('añadir clientes')) return;
      ok.disabled = true; er.hidden = false; er.textContent = 'Creando el cliente y su enlace…';
      var c = {key: slug(name) + '-' + rid(3), name: name, c: pick, code: rid(10)};
      state.clients.push(c); SHARES[c.key] = c.code;
      var saved = await saveNow();
      try { if (saved) await putViewer(c); } catch(err){ saved = false; }
      if (!saved){ er.textContent = 'No se pudo crear el enlace en GitHub. Revisa tu conexión y vuelve a intentarlo.'; ok.disabled = false; return; }
      goReload(c.key);
    });

    // Per client: add / edit / delete activations, delete added clients
    panels.forEach(function(panel){
      var ck = panel.dataset.client, ol = panel.querySelector('ol.timeline'); if (!ol) return;
      var addEv = el('button','addtask addev','+ Añadir activación'); addEv.type = 'button'; addEv.style.marginLeft = '0';
      ol.parentNode.insertBefore(addEv, ol.nextSibling);
      function openForm(ev){
        var old = panel.querySelector('.evform'); if (old) old.remove();
        var f = el('form','lform evform');
        var n = el('input'); n.type = 'text'; n.placeholder = 'Nombre de la activación'; n.maxLength = 80; n.id = 'ev-n-' + ck; n.value = ev ? ev.name : ''; n.setAttribute('aria-label','Nombre de la activación');
        var d1 = el('input'); d1.type = 'date'; d1.id = 'ev-d-' + ck; d1.value = ev ? ev.d : ''; d1.setAttribute('aria-label','Fecha');
        var d2 = el('input'); d2.type = 'date'; d2.id = 'ev-d2-' + ck; d2.value = ev && ev.d2 ? ev.d2 : ''; d2.setAttribute('aria-label','Fecha de fin (opcional)'); d2.title = 'Fecha de fin (opcional)';
        var u = el('input'); u.type = 'text'; u.placeholder = 'Landing (opcional)'; u.id = 'ev-u-' + ck; u.value = ev && ev.url ? ev.url : ''; u.setAttribute('aria-label','Landing');
        var m = el('input'); m.type = 'text'; m.placeholder = 'Hora · lugar (opcional)'; m.maxLength = 120; m.id = 'ev-m-' + ck; m.value = ev && ev.meta ? ev.meta : ''; m.setAttribute('aria-label','Detalles');
        var ok2 = el('button','ok', ev ? 'Guardar' : 'Añadir'); ok2.type = 'submit';
        var no2 = el('button','cancel','Cancelar'); no2.type = 'button';
        var er2 = el('span','err'); er2.hidden = true;
        f.append(n, d1, d2, u, m, ok2, no2, er2);
        addEv.hidden = true; addEv.parentNode.insertBefore(f, addEv); n.focus();
        function close(){ f.remove(); addEv.hidden = false; }
        no2.addEventListener('click', close);
        f.addEventListener('submit', async function(e){
          e.preventDefault();
          if (!n.value.trim() || !d1.value){ er2.textContent = 'Pon al menos el nombre y la fecha.'; er2.hidden = false; return; }
          var url = u.value.trim() ? cleanUrl(u.value) : '';
          if (u.value.trim() && !url){ er2.textContent = 'La landing no es una dirección válida.'; er2.hidden = false; return; }
          if (needToken('añadir activaciones')) return;
          ok2.disabled = true;
          var data = {name: n.value.trim(), d: d1.value, d2: d2.value && d2.value > d1.value ? d2.value : '', url: url, meta: m.value.trim()};
          var list = state.events[ck] = state.events[ck] || [];
          if (ev){ list.forEach(function(x){ if (x.key === ev.key) Object.assign(x, data); }); }
          else list.push(Object.assign({key: 'e-' + rid(8)}, data));
          if (await saveNow()) goReload(ck); else { ok2.disabled = false; er2.textContent = 'No se pudo guardar. Inténtalo de nuevo.'; er2.hidden = false; }
        });
      }
      addEv.addEventListener('click', function(){ openForm(null); });
      panel.querySelectorAll('li.row[data-dyn]').forEach(function(row){
        var ev = (state.events[ck] || []).filter(function(x){ return x.key === row.dataset.key; })[0]; if (!ev) return;
        var tools = el('span','evtools');
        var ed = el('button','edittask','✎'); ed.type = 'button'; ed.setAttribute('aria-label','Editar activación'); ed.style.opacity = '1';
        var del = el('button','deltask','×'); del.type = 'button'; del.setAttribute('aria-label','Borrar activación'); del.style.opacity = '1';
        tools.append(ed, del); row.querySelector('.ev').appendChild(tools);
        ed.addEventListener('click', function(){ openForm(ev); });
        var armed;
        del.addEventListener('click', async function(){
          if (!del.classList.contains('armed')){ del.classList.add('armed'); del.textContent = 'Borrar activación'; clearTimeout(armed); armed = setTimeout(function(){ del.classList.remove('armed'); del.textContent = '×'; }, 3000); return; }
          if (needToken('borrar activaciones')) return;
          state.events[ck] = (state.events[ck] || []).filter(function(x){ return x.key !== ev.key; });
          if (!state.events[ck].length) delete state.events[ck];
          delete state.custom[ev.key]; delete state.order[ev.key];
          if (await saveNow()) goReload(ck);
        });
      });
      if (panel.dataset.dyn){
        var meta = state.clients.filter(function(c){ return c.key === ck; })[0];
        var rm = el('button','rmclient','Eliminar cliente'); rm.type = 'button';
        panel.appendChild(rm);
        var armed2;
        rm.addEventListener('click', async function(){
          if (!rm.classList.contains('armed')){ rm.classList.add('armed'); rm.textContent = 'Pulsa otra vez para eliminar ' + meta.name + ' y todo su contenido'; clearTimeout(armed2); armed2 = setTimeout(function(){ rm.classList.remove('armed'); rm.textContent = 'Eliminar cliente'; }, 4000); return; }
          if (needToken('eliminar clientes')) return;
          (state.events[ck] || []).forEach(function(x){ delete state.custom[x.key]; delete state.order[x.key]; });
          delete state.events[ck]; delete state.notes[ck];
          state.clients = state.clients.filter(function(c){ return c.key !== ck; });
          delete SHARES[ck];
          if (await saveNow()){ try { await putFile(meta.code + '/data.json', {}, false); } catch(e){} goReload('home'); }
        });
      }
    });
  })();

  if (VIEW){ readOnly = true; lockBoxes(); }
  showTab(VIEW || start || 'home', false);
  syncLabel(); pullRemote();
})();
</script>
