<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santaló Candles · Calendario editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#fbf6ee;--bg2:#f6efe3;--bg3:#f1e8d9;--card:#fff;--line:#efe6d8;--line2:#e2d6c3;
  --tx:#1d1b18;--tx2:#5d574e;--tx3:#a39a8c;--ink:#161616;--lime:#e4ff3a;--lime2:#f4ffb0;
  --accent:#6c5ce7;--red:#e5484d;--redbg:#ffecec;--amber:#b7791f;--amberbg:#fff4dc;--green:#2f9e5b;
  --paid:#ff8a3d;--paidbg:#fff0e5;
  --r:16px;--sh:0 1px 2px rgba(60,40,10,.04),0 8px 24px -12px rgba(60,40,10,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-size:13.5px;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h3,h4,.disp{font-family:'Bricolage Grotesque',Inter,sans-serif}
.app{display:flex;height:100vh;overflow:hidden}
/* Sidebar */
.side{width:236px;flex:none;background:var(--ink);color:#e9e5dc;display:flex;flex-direction:column;padding:14px 10px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:13px;transform:rotate(-6deg);font-family:'Bricolage Grotesque',sans-serif}
.brand b{display:block;font-size:14px;color:#fff;font-family:'Bricolage Grotesque',sans-serif}
.brand small{color:#8f8a80;font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;color:#c9c4b9;text-decoration:none;font-weight:500;cursor:pointer;transition:background .15s,transform .15s}
.nav a:hover{background:#262522;color:#fff;transform:translateX(2px)}
.nav a.on{background:var(--lime);color:var(--ink);font-weight:600}
.nav a .ic{width:20px;text-align:center;font-size:15px}
.nav a .ct{margin-left:auto;font-size:11px;opacity:.7;font-weight:600}
.nav a .ct.red{color:#ff8f8f;opacity:1}
.nav a.on .ct.red{color:var(--red)}
.navlbl{font-size:10.5px;color:#7d786e;padding:16px 10px 5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.side .foot{margin-top:auto;padding:14px 8px 2px;font-size:11px;color:#8f8a80;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.side .foot .syn{display:flex;align-items:center;gap:6px;flex:1 1 100%;margin-top:8px;line-height:1.35}
.dotst{width:8px;height:8px;border-radius:50%;background:#8f8a80;flex:none}
.dotst.ok{background:#54d38a}.dotst.warn{background:#ffc53d}.dotst.err{background:var(--red)}
.btn-new{margin:0 2px 14px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--lime);color:var(--ink);border:0;border-radius:14px;padding:10px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 0 #a9c21c}
.btn-new:hover{transform:translateY(-1px)}
.btn-new:active{transform:translateY(3px);box-shadow:0 1px 0 #a9c21c}
.lang{display:inline-flex;border:1px solid #3a3833;border-radius:8px;overflow:hidden;margin-left:auto}
.lang button{border:0;background:transparent;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;color:#8f8a80}
.lang button.on{background:var(--lime);color:var(--ink)}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;align-items:flex-end;gap:4px;padding:10px 22px 0;overflow-x:auto;flex:none;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:8px;padding:8px 14px 9px;border-radius:14px 14px 0 0;cursor:pointer;color:var(--tx2);font-weight:600;white-space:nowrap;background:var(--bg3);max-width:260px;transition:background .15s}
.tab:hover{background:#ece2d0}
.tab.on{background:var(--card);color:var(--tx);box-shadow:0 -2px 10px -6px rgba(60,40,10,.25)}
.tab .cd{width:10px;height:10px;border-radius:50%;flex:none}
.tab .nm{overflow:hidden;text-overflow:ellipsis}
.tab .mn{border:0;background:transparent;cursor:pointer;color:var(--tx3);padding:0 4px;border-radius:6px;font-size:15px;line-height:1}
.tab .mn:hover{background:var(--bg3);color:var(--tx)}
.tab .ct{font-size:11px;color:var(--red)}
.tabadd{border:1px dashed var(--line2);background:transparent;color:var(--tx3);cursor:pointer;padding:6px 12px;border-radius:12px;white-space:nowrap;font-weight:600;margin-bottom:4px}
.tabadd:hover{color:var(--tx);border-color:var(--tx3);background:#fff}
.workspace{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border-radius:18px 18px 0 0;margin:0 10px;box-shadow:0 -1px 0 var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:16px 26px 12px;min-height:60px}
.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.02em}
.top .sub{color:var(--tx3);font-size:12.5px;margin-top:2px}
.top .sp{flex:1}
.top .today{background:var(--bg2);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--tx2);font-weight:500}
.mob-toggle{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer}
.content{flex:1;overflow:auto;padding:6px 26px 70px}
.demo-banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--amberbg);border:1px dashed #efd18f;color:#7a5512;border-radius:14px;padding:10px 14px;margin-bottom:18px;font-size:12.5px}
.demo-banner .sp{flex:1}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:11px;padding:7px 12px;cursor:pointer;font-weight:600;white-space:nowrap;line-height:1.2;transition:transform .12s,background .12s}
.btn:hover{background:var(--bg2);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ink);color:var(--lime);border-color:var(--ink)}
.btn.pri:hover{background:#000}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg2)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:9px}
.btn.icon{padding:5px 8px}
.seg{display:inline-flex;border-radius:12px;padding:3px;background:var(--bg2);gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--ink);color:var(--lime)}
/* Cards & KPIs */
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{border-radius:18px;padding:14px 16px;background:var(--kc,#f7f1e6);cursor:pointer;transition:transform .2s;position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-3px) rotate(-.5deg)}
.kpi .emo{position:absolute;right:10px;top:8px;font-size:26px;opacity:.9;transition:transform .3s}
.kpi:hover .emo{transform:scale(1.2) rotate(10deg)}
.kpi .l{color:var(--tx2);font-size:12px;font-weight:600}
.kpi .v{font-size:32px;font-weight:700;margin-top:8px;letter-spacing:-.03em;font-family:'Bricolage Grotesque',sans-serif}
.kpi .h{font-size:11px;color:var(--tx2);opacity:.75;margin-top:1px}
.kpi.alert{background:#ffe1e1}.kpi.alert .v{color:var(--red)}
.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:18px}
.card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.card h3 small{font-weight:400;color:var(--tx3);font-family:Inter,sans-serif;font-size:12px}
.two{grid-template-columns:1fr 1fr}
.sec{margin-top:16px}
/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center;font-size:12.5px}
.bar .nm{color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.bar .tr{height:12px;background:var(--bg2);border-radius:8px;position:relative}
.bar .fl{height:100%;border-radius:8px;background:var(--ink);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar .tg{position:absolute;top:-4px;width:3px;height:20px;background:var(--ink);border-radius:2px}
.bar .n{text-align:right;color:var(--tx2);font-variant-numeric:tabular-nums;font-weight:600}
.pipe{display:flex;height:16px;border-radius:10px;overflow:hidden;background:var(--bg2);gap:2px}
.pipe span{height:100%;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--tx2)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:20px;font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--c) 16%,#fff);color:color-mix(in srgb,var(--c) 70%,#000);white-space:nowrap;line-height:1.55}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--bg2);color:var(--tx2);font-size:11.5px;white-space:nowrap;font-weight:500}
.tag.red{background:var(--redbg);color:var(--red)}
.tag.amber{background:var(--amberbg);color:var(--amber)}
.tag.viral{background:#efe7ff;color:#6b3fd6}
.tag.ads{background:var(--paidbg);color:#c25412}
.tag.lime{background:var(--lime2);color:#4d5a00}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none;border:2px solid #fff}
/* filters */
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.fbar .search{position:relative;flex:0 1 250px;min-width:160px}
.fbar .search input{width:100%;padding:7px 10px 7px 30px}
.fbar .search span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.inp,.fbar input,.fbar select{border:1px solid var(--line2);border-radius:10px;padding:7px 9px;background:#fff;outline:none;min-width:0}
.fbar select{max-width:160px}
.fbar select.act,.fbar input.act{border-color:var(--ink);background:var(--lime2)}
.inp:focus,.fbar input:focus,.fbar select:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--lime2)}
.chk{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line2);border-radius:10px;cursor:pointer;background:#fff;user-select:none;font-weight:500}
.chk.act{border-color:var(--red);color:var(--red);background:var(--redbg)}
/* tables */
.tblwrap{border:1px solid var(--line);border-radius:var(--r);overflow:auto;background:#fff}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--bg2);text-align:left;font-weight:600;color:var(--tx2);font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--tx)}
td{padding:4px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fffbf4}
td .cell{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 7px;width:100%;outline:none;min-width:70px}
td .cell:hover{border-color:var(--line)}
td .cell:focus{border-color:var(--ink);background:#fff}
td select.cell{min-width:118px;cursor:pointer;appearance:none;-webkit-appearance:none}
td .ttl{min-width:240px;font-weight:600}
td.id{color:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums;cursor:pointer}
td.id:hover{color:var(--accent)}
td.late input{color:var(--red);font-weight:600}
.rowact{display:flex;gap:2px;opacity:.5}
tr:hover .rowact{opacity:1}
.stsel{border-radius:20px!important;padding:4px 10px!important;font-size:11.5px;font-weight:600;min-width:110px!important}
/* calendar */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.calbar .lbl{font-size:20px;font-weight:700;min-width:180px;text-transform:capitalize;font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.calwrap{display:flex;gap:14px;align-items:flex-start}
.calmain{flex:1;min-width:0}
.layers{display:inline-flex;gap:6px;flex-wrap:wrap}
.layer{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;user-select:none}
.layer.on.paid{background:var(--paidbg);border-color:#ffc49c;color:#c25412}
.layer.on.mom{background:#f3ecff;border-color:#d8c8ff;color:#6b3fd6}
.layer.on.hint{background:var(--lime2);border-color:#d6ec5a;color:#4d5a00}
.month{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--bg2)}
.mhead div{padding:8px 10px;font-size:11.5px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.wk{border-top:1px solid var(--line)}
.wk:first-of-type{border-top:0}
.bands{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px 0;padding:4px 0 0}
.bands:empty{display:none}
.band{margin:0 3px;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.6}
.band.paid{background:repeating-linear-gradient(135deg,#ffe3cf 0 8px,#ffd7bb 8px 16px);color:#9c4210}
.band.paid.tbd{background:repeating-linear-gradient(135deg,#fff3ea 0 8px,#fff 8px 16px);border:1px dashed #ffb27d}
.band.mom{background:color-mix(in srgb,var(--c) 22%,#fff);color:color-mix(in srgb,var(--c) 60%,#000)}
.band:hover{filter:brightness(.97)}
.cells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.c{min-height:116px;border-right:1px solid var(--line);padding:5px;position:relative;display:flex;flex-direction:column;gap:4px;transition:background .15s}
.c:nth-child(7n){border-right:0}
.c.out{background:#fcfaf6}
.c.out .dn{opacity:.45}
.c .dn{font-size:12.5px;font-weight:700;color:var(--tx2);display:flex;align-items:center;justify-content:space-between;height:24px;padding:0 2px}
.c.today{background:#fdffe8}
.c.today .dn b{background:var(--ink);color:var(--lime);border-radius:12px;padding:2px 8px}
.c .add{opacity:0;border:0;background:var(--bg2);cursor:pointer;color:var(--tx2);font-size:14px;line-height:1;padding:2px 6px;border-radius:7px}
.c:hover .add{opacity:1}
.c .add:hover{background:var(--ink);color:var(--lime)}
.ms{display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:#7a5512;background:var(--amberbg);border-radius:6px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms.paid{color:#9c4210;background:var(--paidbg)}
.ev{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 7px;border-radius:9px;background:color-mix(in srgb,var(--pc) 18%,#fff);cursor:pointer;overflow:hidden;white-space:nowrap;transition:transform .12s;border:1px solid color-mix(in srgb,var(--pc) 30%,#fff)}
.ev:hover{transform:scale(1.03)}
.ev .fe{flex:none}
.ev .t{color:var(--tx2);font-variant-numeric:tabular-nums;flex:none;font-size:10.5px}
.ev .n{overflow:hidden;text-overflow:ellipsis;flex:1;font-weight:600}
.ev .s{width:8px;height:8px;border-radius:50%;background:var(--sc);flex:none;box-shadow:0 0 0 2px #fff}
.ev.late{outline:2px solid var(--red);outline-offset:-1px}
.hint{border:1.5px dashed var(--line2);border-radius:9px;padding:3px 7px;font-size:11px;color:var(--tx3);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s}
.hint:hover{border-color:var(--ink);color:var(--ink);background:var(--lime2)}
.more{font-size:11px;color:var(--tx3);padding:1px 6px;cursor:pointer;font-weight:600}
.more:hover{color:var(--tx)}
.dragover{outline:3px dashed var(--ink);outline-offset:-4px;background:var(--lime2)!important}
.weekbands{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.weekbands .band{margin:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{background:var(--bg2);border-radius:16px;min-height:430px;display:flex;flex-direction:column}
.wcol .wh{padding:10px 12px;display:flex;align-items:baseline;gap:6px}
.wcol .wh b{font-size:22px;font-weight:700;font-family:'Bricolage Grotesque',sans-serif}
.wcol .wh span{color:var(--tx3);font-size:12px;text-transform:capitalize;font-weight:600}
.wcol.today{background:#f7ffc9}
.wcol .wb{padding:0 8px 8px;display:flex;flex-direction:column;gap:7px;flex:1}
.wcol .wadd{margin-top:auto;border:1.5px dashed var(--line2);background:transparent;border-radius:11px;padding:7px;color:var(--tx3);cursor:pointer;font-size:12px;font-weight:600}
.wcol .wadd:hover{color:var(--ink);border-color:var(--ink);background:#fff}
.kc{background:#fff;border:1px solid var(--line);border-left:5px solid var(--pc,var(--line2));border-radius:13px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:transform .15s,box-shadow .15s}
.kc:hover{transform:translateY(-2px) rotate(-.4deg);box-shadow:var(--sh)}
.kc .tt{font-weight:600;line-height:1.35;white-space:normal}
.ev.pub{background:#dcfce7!important;border-color:#86efac!important;color:#14532d}
.ev.pub .n::before{content:'✓ ';font-weight:800;color:#16a34a}
.kc.pub{background:#f0fdf4;border-color:#bbf7d0;border-left-color:#16a34a}
.kc.pub .tt::before{content:'✓ ';color:#16a34a;font-weight:800}
.lrow.pub{background:#f0fdf4}
.lrow.pub .tt{color:#14532d}
.wfinfo{display:flex;flex-direction:column;gap:2px;font-size:11.5px}
.wfi{display:flex;gap:6px}.wfi span{color:var(--tx3);min-width:72px;flex:none}.wfi b{font-weight:600;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wfcopy{font-size:11.5px;color:var(--tx2);background:var(--bg2);border-radius:8px;padding:6px 8px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kanban .kc{cursor:zoom-in}
.kc .mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2)}
.kc .mt .sp{flex:1}
.kc.late{border-color:#ffc9c9;border-left-color:var(--red)}
.unsched{width:240px;flex:none;border-radius:18px;background:var(--bg2);padding:12px;max-height:calc(100vh - 230px);overflow:auto}
.unsched h4{margin:0 0 4px;font-size:14px}
.unsched p{margin:0 0 10px;font-size:11.5px;color:var(--tx3);line-height:1.4}
.unsched .kc{margin-bottom:7px}
.lgroup{margin-bottom:18px}
.lgroup h4{font-size:13px;font-weight:700;margin:0 0 6px;color:var(--tx2);display:flex;align-items:center;gap:8px;text-transform:capitalize}
.lrow{display:grid;grid-template-columns:36px 1fr 190px 120px;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-top:0;background:#fff;cursor:pointer}
.lrow:first-of-type{border-top:1px solid var(--line);border-radius:14px 14px 0 0}
.lrow:last-child{border-radius:0 0 14px 14px}
.lrow:only-of-type{border-radius:14px}
.lrow:hover{background:#fffbf4}
.lrow .tm{color:var(--tx3);font-variant-numeric:tabular-nums}
.lrow .tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sm{color:var(--tx3);font-size:12px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* kanban */

async function ghGet(path){
  if(ghTok()){const r=await fetch(ghApi(path)+'?ref=main&t='+Date.now(),{headers:ghH(),cache:'no-store'});if(r.status===404){shas[path]=null;return null}if(!r.ok)throw r.status;const j=await r.json();shas[path]=j.sha;return JSON.parse(b64d(j.content))}

}
const ghQ={};
function ghWrite(path,getObj){
  if(!ghTok()){setSync('local','sync_ghlocal');return}
  const q=ghQ[path]=ghQ[path]||{busy:false,again:false,timer:null,get:null};q.get=getObj;
  setSync('saving','sync_saving');clearTimeout(q.timer);q.timer=setTimeout(()=>ghRun(path),1000);
}
async function ghRun(path,retry){
  const q=ghQ[path];if(q.busy){q.again=true;return}q.busy=true;
  try{
    let obj=q.get();const wid=(path.match(/\/ws-(.+)\.json$/)||[])[1];
    if(wid&&lockOf(wid)){if(LOCKED[wid]||!dkOk(wid))throw 'locked';obj=await encWs(wid,obj)}
    const body={message:'Calendario editorial: guardar',content:b64e(JSON.stringify(obj,null,1)),branch:'main'};
    if(shas[path]===undefined){try{const g=await fetch(ghApi(path)+'?ref=main&t='+Date.now(),{headers:ghH(),cache:'no-store'});shas[path]=g.ok?(await g.json()).sha:null}catch(e){}}
    if(shas[path])body.sha=shas[path];
    const r=await fetch(ghApi(path),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghH()),body:JSON.stringify(body)});
    if((r.status===409||r.status===422)&&!retry){delete shas[path];q.busy=false;return ghRun(path,true)}
    if(!r.ok)throw r.status;
    shas[path]=(await r.json()).content.sha;
    if(!Object.values(ghQ).some(x=>x!==q&&(x.busy||x.again)))setSync('cloud','sync_gh');
  }catch(e){setSync('err','sync_gherr')}

}

let db=null,cloud=false;const writers={};const subs={};
function writer(path){
  if(writers[path])return writers[path];
  const w={path,writing:false,pending:null,last:'',timer:null};
  w.push=j=>{w.pending=j;clearTimeout(w.timer);w.timer=setTimeout(()=>run(w),450)};
  return writers[path]=w;
}
async function run(w){
  if(!db||!cloud||w.writing||w.pending==null)return;
  const j=w.pending;w.pending=null;if(j===w.last){maybeSynced();return}
  w.writing=true;const doSet=()=>db.doc(w.path).set({state:j,updatedAt:new Date().toISOString()});
  try{await doSet();w.last=j}catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await doSet();w.last=j}catch(e2){setSync('err','sync_err')}}
    else if(e&&(e.code==='invalid_argument'||e.code==='not_granted'))setSync('err','sync_ro');else setSync('err','sync_err');
  }
  w.writing=false;if(w.pending!=null)run(w);else maybeSynced();
}
function maybeSynced(){if(sync.mode==='err')return;if(Object.values(writers).some(w=>w.writing||w.pending!=null))return;setSync('cloud','sync_cloud')}
function save(){
  if(!S||RO())return;S.updatedAt=new Date().toISOString();WS_CACHE[ACTIVE]=S;lsSave();
  if(GH){const id=ACTIVE,st=S;ghWrite(wsPath(id),()=>st);return}
  if(db&&cloud){setSync('saving','sync_saving');writer('workspaces/'+ACTIVE).push(JSON.stringify(S))}else setSync('local','sync_local');
}

}
function subscribeWs(id){
  if(!db||!cloud)return;if(subs.ws){subs.ws();subs.ws=null}
  const path='workspaces/'+id;
  subs.ws=db.doc(path).onSnapshot(snap=>{
    if(id!==ACTIVE)return;const w=writer(path);
    if(snap.exists){
      const j=snap.data()&&snap.data().state;
      if(typeof j==='string'&&j!==w.last&&j!==JSON.stringify(S)){let st=null;try{st=normalize(JSON.parse(j))}catch(e){}
        if(st&&!(w.writing||w.pending!=null)){w.last=j;S=st;WS_CACHE[id]=st;lsSave();wsLoading=false;render();if(UI.drawer&&!UI.dirty)refreshDrawerFromState()}}
      else if(typeof j==='string')w.last=j;
      if(wsLoading){wsLoading=false;render()}
    }else if(!snap.metadata.fromCache){if(!S){S=blankState();WS_CACHE[id]=S}if(wsLoading){wsLoading=false;render()}writer(path).push(JSON.stringify(S))}
  },()=>{if(id===ACTIVE){wsLoading=false;render()}});
}
async function initDb(){
  if(GH||!(window.claude&&typeof window.claude.use==='function'))return;
  let d=null;try{d=await window.claude.use('db')}catch(e){}
  if(!d)return;db=d;setSync('saving','sync_conn');
  const timer=setTimeout(()=>{if(!cloud)setSync('err','sync_slow')},10000);let first=true;
  subs.meta=db.doc('meta/clients').onSnapshot(snap=>{
    if(snap.metadata.fromCache&&!snap.exists)return;clearTimeout(timer);const w=writer('meta/clients');
    if(snap.exists){let c=null;try{c=JSON.parse(snap.data().state)}catch(e){}
      if(c&&Array.isArray(c.list)&&c.list.length){const j=JSON.stringify(c);
        if(j!==w.last&&!(w.writing||w.pending!=null)){w.last=j;CL=c;if(!CL.list.some(x=>x.id===ACTIVE)){ACTIVE=CL.list[0].id;S=WS_CACHE[ACTIVE]?normalize(WS_CACHE[ACTIVE]):null;wsLoading=!S}lsSave();render()}else w.last=j}}
    else if(first){cloud=true;for(const c of CL.list){const st=WS_CACHE[c.id];if(st)writer('workspaces/'+c.id).push(JSON.stringify(st))}writer('meta/clients').push(JSON.stringify(CL))}
    if(first){first=false;cloud=true;subscribeWs(ACTIVE);if(sync.mode!=='err')setSync('cloud','sync_cloud')}
  },()=>{clearTimeout(timer);cloud=false;setSync('err','sync_off')});
}

function filtered(list){
  const f=UI.f,q=f.q.trim().toLowerCase();
  return list.filter(p=>{
    if(f.format&&p.format!==f.format)return false;
    if(f.pillar&&p.pillar!==f.pillar)return false;
    if(f.status&&p.status!==f.status)return false;
    if(f.owner&&(f.owner==='__none'?!!member(p.owner):p.owner!==f.owner))return false;
    if(f.delayed&&!isDelayed(p))return false;

  });
}

function weekSlots(ws){
  const wp=S.posts.filter(p=>inRange(p.date,ws,addDays(ws,6)));
  return S.rhythm.map(r=>{let m;const d=r.day>=1?addDays(ws,r.day-1):'';
    if(d)m=wp.find(p=>p.date===d&&String(p.format).toLowerCase()===String(r.format).toLowerCase())||wp.find(p=>p.date===d);
    else m=wp.find(p=>String(p.format).toLowerCase().includes('stor'));
    return {r,m,d}});
}

  if(!S.rhythm.length)return '';

  const feed=S.posts.filter(p=>inRange(p.date,ws,addDays(ws,6))&&!String(p.format).toLowerCase().includes('stor'));

  <div class="rhythm">${slots.map(({r,m,d})=>`<div class="slot ${r.day?'':'bonus'}" style="border-top:4px solid ${pColor(r.pillar)}" ${m?`data-open="${m.id}"`:''}><span class="ok">${m?'✅':'⬜'}</span><div class="d">${r.day?DFULL[LANG][r.day-1]+' · '+fmtShort(d):t('bonus')}</div><div class="f">${fEmo(r.format)} ${esc(lv(r.format))}</div><div class="p">${esc(tv(r,'label')||pillarName(r.pillar))}</div>${m?`<div class="note" style="margin-top:6px;color:var(--tx2)">${esc(tv(m,'title'))}</div>`:(r.day&&!RO()?`<button class="btn sm" style="margin-top:8px" data-slot="${r.id}" data-sdate="${d}">${t('create')}</button>`:'')}</div>`).join('')}</div>

function pillarDist(posts){
  const base=posts.filter(p=>p.date),tot=base.length;
  const rows=S.pillars.map(pl=>{const n=base.filter(p=>p.pillar===pl.id).length;return {id:pl.id,name:tv(pl,'name'),color:pl.color,n,pct:tot?Math.round(n/tot*100):0,target:+pl.target||0}});
  const off=rows.filter(r=>r.target&&Math.abs(r.pct-r.target)>=10);
  return {rows,tot,warn:tot&&off.length?t('imbalance')+': '+off.map(r=>`${r.name} ${r.pct>r.target?t('above'):t('below')} (${r.pct}% vs ${r.target}%)`).join(' · '):''};
}

function evChip(p){const s=SMAP[p.status];return `<div class="ev ${isDelayed(p)?'late':''} ${p.status==='published'?'pub':''}" draggable="true" data-drag="${p.id}" data-open="${p.id}" style="--pc:${pColor(p.pillar)};--sc:${s.c}" title="${esc(tv(p,'title'))} · ${esc(lv(p.format))} · ${s.l}"><span class="fe">${fEmo(p.format)}</span><span class="n">${esc(tv(p,'title')||t('untitled'))}</span>${p.viral?'<span class="fe">🧪</span>':''}<span class="s"></span></div>`}
function bandsFor(ws,we){
  const items=[];
  for(const c of S.paid)for(const f of c.flights){if(!f.start)continue;const fe=f.end||f.start;if(overlap(f.start,fe,ws,we))items.push({kind:'paid',s:f.start,e:fe,label:`💸 ${tv(f,'name')}${f.daily&&!f.tbd?` · ${f.daily} €/d`:''}`,tbd:f.tbd})}
  for(const m of S.moments){if(!m.start)continue;const me=m.end||m.start;if(overlap(m.start,me,ws,we))items.push({kind:'mom',s:m.start,e:me,label:`🎁 ${tv(m,'name')}`,color:m.color||'#7c5cd6'})}
  return items;
}
function bandHTML(b,ws){const a=b.s<ws?0:daysBetween(ws,b.s)-1,we=addDays(ws,6),z=daysBetween(ws,b.e<we?b.e:we);return `<div class="band ${b.kind} ${b.tbd?'tbd':''}" style="grid-column:${a+1}/${z+1};${b.color?'--c:'+b.color:''}" data-band="${b.kind}" title="${esc(b.label)}">${esc(b.label)}</div>`}
function hintsFor(d,dp){
  if(RO()||!S.rhythm.length||d<today())return '';const dow=(parse(d).getDay()+6)%7+1;
  return S.rhythm.filter(r=>r.day===dow&&!dp.some(p=>String(p.format).toLowerCase()===String(r.format).toLowerCase())).map(r=>`<div class="hint" data-slot="${r.id}" data-sdate="${d}">＋ ${fEmo(r.format)} ${esc(lv(r.format))}</div>`).join('');
}
const msFor=d=>S.milestones.filter(m=>m.date===d).map(m=>`<div class="ms ${m.kind==='paid'?'paid':''}" title="${esc(tv(m,'label'))}">📍 ${esc(tv(m,'label'))}</div>`).join('');
function calMonth(posts){
  const cur=parse(UI.cal.cursor),start=startOfWeek(iso(new Date(cur.getFullYear(),cur.getMonth(),1))),end=addDays(startOfWeek(iso(new Date(cur.getFullYear(),cur.getMonth()+1,0))),6),td=today();
  const by={};for(const p of posts)if(p.date)(by[p.date]=by[p.date]||[]).push(p);
  let h=`<div class="mhead">${DOW[LANG].map(d=>`<div>${d}</div>`).join('')}</div>`;
  for(let ws=start;ws<=end;ws=addDays(ws,7)){
    h+=`<div class="wk"><div class="bands">${bandsFor(ws,addDays(ws,6)).map(b=>bandHTML(b,ws)).join('')}</div><div class="cells">`;
    for(let d=ws;d<=addDays(ws,6);d=addDays(d,1)){
      const list=(by[d]||[]).sort(cmpDate),out=parse(d).getMonth()!==cur.getMonth(),exp=UI.cal.expanded===d,shown=exp?list:list.slice(0,3);
      h+=`<div class="c ${out?'out':''} ${d===td?'today':''}" data-drop-date="${d}"><div class="dn"><b>${parse(d).getDate()}</b>${RO()?'':`<button class="add" data-newdate="${d}" title="${t('addContent')}">＋</button>`}</div>${msFor(d)}${shown.map(evChip).join('')}${list.length>3&&!exp?`<span class="more" data-expand="${d}">+${list.length-3} ${t('more')}</span>`:''}${exp&&list.length>3?`<span class="more" data-expand="">${t('showLess')}</span>`:''}${out?'':hintsFor(d,list)}</div>`;
    }

  return `<div class="month">${h}</div>`;
}

function calWeek(posts){

const money=n=>(Math.round(n*100)/100).toLocaleString(LANG==='en'?'en-GB':'es-ES')+' €';
/* month-by-month budget of one campaign (or all when c is null) */
function budgetByMonth(c){
  const flights=c?c.flights:S.paid.flatMap(x=>x.flights),out={};
  for(const f of flights){if(!f.start)continue;const e=f.end||f.start;
    for(let d=f.start;d<=e;d=addDays(d,1)){const k=d.slice(0,7);const m=out[k]=out[k]||{k,total:0,days:0,dailies:new Set(),tbd:false,phases:new Set()};
      m.phases.add(tv(f,'name'));if(f.tbd){m.tbd=true;continue}m.total+=+f.daily||0;m.days++;m.dailies.add(+f.daily||0)}}
  return Object.values(out).sort((a,b)=>a.k.localeCompare(b.k));
}
const monthName=k=>{const [y,m]=k.split('-').map(Number);return MONTHS[LANG][m-1]+' '+y};
function todayDaily(){return flightsOn(today()).reduce((a,x)=>a+(+x.f.daily||0),0)}

    const act=c.flights.find(f=>!f.tbd&&inRange(td,f.start,f.end)),thisM=months.find(m=>m.k===curK);
    const cx=f=>`data-x="camp||${c.id}|${f}"`;
    const monthRows=months.map(m=>{const ds=[...m.dailies],pct=cap?Math.min(100,m.total/cap*100):0;
      return `<div class="mrow ${m.k===curK?'cur':''}"><div class="mn">${monthName(m.k)}${m.k===curK?` <span class="tag lime">${t('today')}</span>`:''}</div>
        <div class="md">${m.tbd&&!m.days?t('tbd'):(ds.length?ds.map(x=>x+' €').join(' → ')+' / '+t('dayShort'):'—')}</div>
        <div class="mb2">${cap?`<div class="tr"><div class="fl" style="width:${pct}%"></div></div>`:''}</div>
        <div class="mt2"><b>${m.tbd&&!m.days?'—':'≈'+money(m.total)}</b>${cap?`<small> / ${money(cap)}</small>`:''}</div></div>`}).join('');
    const phases=c.flights.map(f=>{const live=!f.tbd&&inRange(td,f.start,f.end),past=f.end&&f.end<td;
      return `<div class="phase ${live?'live':''} ${past?'past':''} ${f.tbd?'tbd':''}">
        <div class="ph-top"><b>${esc(tv(f,'name'))}</b>${live?`<span class="tag lime">● ${t('liveNow')}</span>`:''}<span class="sp"></span>${RO()?'':`<button class="btn ghost icon sm" data-editflight="${c.id}|${f.id}">✎</button><button class="btn ghost icon sm" data-xdel="flight|${c.id}|${f.id}">🗑</button>`}</div>
        <div class="ph-dates">${f.start?fmtRange(f.start,f.end):'—'}${f.start&&f.end?` · ${daysBetween(f.start,f.end)} ${t('daysL')}`:''}</div>

async function callClaude(sys,user,maxTokens){
  let err='';
  for(const model of ['claude-sonnet-5-5','claude-opus-5-5']){
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':aiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model,max_tokens:maxTokens||1500,system:sys,messages:[{role:'user',content:user}]})});
      const j=await r.json();
      if(!r.ok){err=(j&&j.error&&j.error.message)||('HTTP '+r.status);if(r.status===404||/model/i.test(err))continue;return {err}}
      const txt=(j.content||[]).map(x=>x.text||'').join('');const m=txt.match(/\{[\s\S]*\}/);
      try{return {data:JSON.parse(m[0])}}catch(e){return {err:t('genBadFormat')}}
    }catch(e){return {err:String(e.message||e)}}
  }
  return {err};
}

async function pwKey(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function lockEnc(pw,tok){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await pwKey(pw,salt),new TextEncoder().encode(tok)));return {v:1,salt:u8b64(salt),iv:u8b64(iv),ct:u8b64(ct),at:new Date().toISOString()}}
async function lockDec(pw,L){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(L.iv)},await pwKey(pw,b64u8(L.salt)),b64u8(L.ct));return new TextDecoder().decode(pt)}
const lockOf=id=>{const c=CL&&CL.list.find(x=>x.id===id);return c&&c.lock&&c.lock.v===2?c.lock:null};
const DKS={};
function dkOk(id){const L=lockOf(id);if(!L)return false;try{return localStorage.getItem('ecm-kid-'+id)===L.kid&&!!localStorage.getItem('ecm-dk-'+id)}catch(e){return false}}
async function dkKey(id){if(DKS[id]&&DKS[id].kid===(lockOf(id)||{}).kid)return DKS[id].k;const raw=b64u8(localStorage.getItem('ecm-dk-'+id));const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);DKS[id]={k,kid:localStorage.getItem('ecm-kid-'+id)};return k}
function dkStore(id,dk,kid){try{localStorage.setItem('ecm-dk-'+id,dk);localStorage.setItem('ecm-kid-'+id,kid)}catch(e){}delete DKS[id]}
function dkForget(id){try{localStorage.removeItem('ecm-dk-'+id);localStorage.removeItem('ecm-kid-'+id)}catch(e){}delete DKS[id]}
async function encWs(id,obj){const L=lockOf(id);const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await dkKey(id),new TextEncoder().encode(JSON.stringify(obj))));return {enc:1,kid:L.kid,iv:u8b64(iv),ct:u8b64(ct)}}
async function decWs(id,o){if(!dkOk(id)||o.kid!==(lockOf(id)||{}).kid)throw 'nokey';const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(o.iv)},await dkKey(id),b64u8(o.ct));return JSON.parse(new TextDecoder().decode(pt))}

function genPw(){const A='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';const r=crypto.getRandomValues(new Uint8Array(12));return [...r].map(x=>A[x%A.length]).join('').replace(/(.{4})(?=.)/g,'$1-')}

async function doUnlock(pw){
  const id=TEAM||ACTIVE;const L=lockOf(id);if(!L)return;
  let o=null;try{o=JSON.parse(await lockDec(pw,L))}catch(e){toast(t('pwBad'));return}
  dkStore(id,o.dk,L.kid);
  if(TEAM){if(o.tok&&await tokOk(o.tok)){try{localStorage.setItem('ecm-team-'+TEAM,o.tok)}catch(e){}}else toast(t('lockExpired'))}
  closeModal();if(TEAM&&ghTok())toast(t('connectOk'));
  const st=await ghLoadWs(ACTIVE);if(st){S=st;WS_CACHE[ACTIVE]=st}else if(LOCKED[ACTIVE])S=null;try{await ghGet(idxPath())}catch(e){}setSync(ghTok()?'cloud':'local',ghTok()?'sync_gh':'sync_ghlocal');render();
}
async function doSetLock(fd){
  const c=client();const pw=(fd.pw||'').trim();let tok=(fd.token||'').trim();
  if(pw.length<8){toast(t('pwShort'));return}
  if(!tok){let tt='',own='';try{tt=localStorage.getItem('armi-team-token')||'';own=localStorage.getItem('armi-gh-token')||''}catch(e){}
    if(tt&&await tokOk(tt))tok=tt;else{try{localStorage.removeItem('armi-team-token')}catch(e){}if(own&&await tokOk(own))tok=own}}
  if(!tok){toast(t('connectBad'));return}
  const dk=u8b64(crypto.getRandomValues(new Uint8Array(32))),kid=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  const L=await lockEnc(pw,JSON.stringify({tok,dk}));L.v=2;L.kid=kid;c.lock=L;dkStore(c.id,dk,kid);LOCKED[c.id]=false;
  saveClients();save();closeModal();toast(t('lockSaved'));render();
}

let qT;
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.f==='q'){UI.f.q=el.value;clearTimeout(qT);qT=setTimeout(render,150);return}
  if(el.dataset.d!==undefined&&draft){if(TXT.includes(el.dataset.d))setTv(draft,el.dataset.d,el.value);else draft[el.dataset.d]=el.value;markDirty()}
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.genpick!==undefined){GEN.pid=el.value;renderGen();return}
  if(el.dataset.wfst){const p=S.posts.find(x=>x.id===el.dataset.wfst);if(p&&!RO()){p.status=el.value;save();render();toast(t('saved'))}return}
  if(el.dataset.f&&el.dataset.f!=='q'){UI.f[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;render();return}
  if(RO())return;
  if(el.dataset.x){xSet(el.dataset.x,el.type==='checkbox'?el.checked:el.value);return}
  if(el.dataset.dchk&&draft&&!dRO()){draft[el.dataset.dchk]=el.checked;markDirty();renderDrawer();return}
  if(el.dataset.edit){const f=el.dataset.edit,p=S.posts.find(x=>x.id===el.dataset.id);if(p&&(f==='title'?tv(p,'title'):p[f])!==el.value)updatePost(p.id,{[f]:el.value},f==='status'?`${p.id} → ${SMAP[el.value].l}`:null);return}
  if(el.dataset.d!==undefined&&draft){if(TXT.includes(el.dataset.d))setTv(draft,el.dataset.d,el.value);else draft[el.dataset.d]=el.value;markDirty();if(['date','status','pillar'].includes(el.dataset.d))renderDrawer();return}
  if(el.dataset.list){S.lists[el.dataset.list]=el.value.split(',').map(s=>s.trim()).filter(Boolean);save();return}
  if(el.dataset.cname!==undefined){client().name=el.value.trim()||t('myClient');saveClients();render();return}
  if(el.name==='color'&&el.closest('form')){el.closest('form').querySelectorAll('.pcol').forEach(s=>s.style.outline='');el.nextElementSibling.style.outline='2px solid var(--tx)';el.nextElementSibling.style.outlineOffset='2px'}
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();const fd=Object.fromEntries(new FormData(f).entries());
  if(f.dataset.form==='aikey'){const k=(fd.key||'').trim();try{if(k)localStorage.setItem('ecm-anthropic-key',k)}catch(_){}closeModal();toast(t('aiSaved'));render();if(UI.drawer)renderDrawer();return}
  if(f.dataset.form==='genreq'){if(RO())return;S.requests=S.requests||[];S.requests.push({id:uid('rq'),createdAt:new Date().toISOString(),idea:(fd.idea||'').trim(),format:fd.format||'',pillar:fd.pillar||'',cta:(fd.cta||'').trim(),audience:(fd.audience||'').trim(),status:'pending'});GEN.idea=null;GEN.paste=false;save();renderGen();toast(t('gSent'));return}
  if(f.dataset.form==='connect'){doConnect((fd.token||'').trim());return}
  if(f.dataset.form==='drive'){S.driveUrl=(fd.url||'').trim();save();render();toast(t('saved')||'OK');return}
  if(f.dataset.form==='unlock'){doUnlock(fd.pw||'');return}
  if(f.dataset.form==='setlock'){doSetLock(fd);return}
  if(RO())return;
  if(f.dataset.form==='capture'){const title=(fd.title||'').trim();if(!title)return;const now=new Date().toISOString();const p=Object.assign({},EMPTY_POST,{id:nextId(),createdAt:now,updatedAt:now});setTv(p,'title',title);S.posts.push(p);save();render();toast(t('ideaAdded'));setTimeout(()=>{const i=document.querySelector('[data-key=capt]');if(i)i.focus()},20);return}
  if(f.dataset.form==='flight'){const c=S.paid.find(x=>x.id===f.dataset.c),o=c&&c.flights.find(x=>x.id===f.dataset.f);if(!o)return;setTv(o,'name',fd.name.trim());setTv(o,'focus',fd.focus.trim());o.start=fd.start;o.end=fd.end&&fd.end>=fd.start?fd.end:fd.start;o.daily=+fd.daily||0;o.tbd=!!fd.tbd;save();closeModal();render();return}
  if(f.dataset.form==='ad'){const c=S.paid.find(x=>x.id===f.dataset.c),o=c&&c.ads.find(x=>x.id===f.dataset.a);if(!o)return;o.code=fd.code.trim();setTv(o,'creative',fd.creative.trim());setTv(o,'dest',fd.dest.trim());save();closeModal();render();return}
  if(f.dataset.form==='ms'){let o=f.dataset.id?S.milestones.find(x=>x.id===f.dataset.id):null;if(!o){o={id:uid('m')};S.milestones.push(o)}o.date=fd.date;o.kind=fd.kind;setTv(o,'label',fd.label.trim());save();closeModal();render();return}
  if(f.dataset.form==='pillar'){const id=f.dataset.id,o=id?pillar(id):{id:uid('pl')};setTv(o,'name',fd.name.trim());setTv(o,'description',fd.description);o.target=+fd.target||0;o.color=fd.color||o.color||PALETTE[0];if(!id)S.pillars.push(o);save();closeModal();render();return}
  if(f.dataset.form==='client'){const id=f.dataset.id,name=fd.name.trim()||t('myClient'),color=fd.color||PALETTE[0];
    if(id){Object.assign(CL.list.find(x=>x.id===id),{name,color});saveClients();closeModal();render();return}
    const nid=uid('c');CL.list.push({id:nid,name,color});const st=fd.start==='demo'?demoState('es'):blankState();WS_CACHE[nid]=st;closeModal();
    if(UI.drawer)closeDrawer(true);ACTIVE=nid;S=st;wsLoading=false;setFilters({});UI.view='overview';save();saveClients();render();if(db&&cloud)subscribeWs(nid);toast(t('clientCreated'));return}
});
/* drag & drop */
let dragId=null;
document.addEventListener('dragstart',e=>{if(RO())return;const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;dragId=el.dataset.drag;try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(_){}el.style.opacity='.5'});
document.addEventListener('dragend',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(el)el.style.opacity='';document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'))});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop-date],[data-drop-status]');if(!z||!dragId)return;e.preventDefault();document.querySelectorAll('.dragover').forEach(x=>x!==z&&x.classList.remove('dragover'));z.classList.add('dragover')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop-date],[data-drop-status]');if(!z||!dragId)return;e.preventDefault();z.classList.remove('dragover');const id=dragId;dragId=null;const p=S.posts.find(x=>x.id===id);if(!p)return;
  if(z.dataset.dropStatus!==undefined){if(p.status!==z.dataset.dropStatus)updatePost(id,{status:z.dataset.dropStatus},`${id} → ${SMAP[z.dataset.dropStatus].l}`)}
  else{const d=z.dataset.dropDate;if(p.date!==d)updatePost(id,{date:d},d?`${id} ${t('movedTo')} ${fmtShort(d)}`:`${id} ${t('movedUns')}`)}
});
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(VIEWS.includes(h)&&h!==UI.view){UI.view=h;render()}});

/* ============ BOOT ============ */
(async function boot(){
  const ls=lsLoad(),h=(location.hash||'').slice(1);if(VIEWS.includes(h))UI.view=h;
  if(GH){
    setSync('saving','sync_ghload');
    let idx=null;try{idx=await ghGet(idxPath())}catch(e){}
    if(idx&&idx.clients&&Array.isArray(idx.clients.list)&&idx.clients.list.length){
      CL=idx.clients;WS_CACHE=Object.assign({},(ls&&ls.ws)||{},idx.ws||{}); // idx.ws = legacy single-file format
      ACTIVE=TEAM&&CL.list.some(c=>c.id===TEAM)?TEAM:(ls&&CL.list.some(c=>c.id===ls.active)?ls.active:CL.list[0].id);
      const st=await ghLoadWs(ACTIVE);if(st)WS_CACHE[ACTIVE]=st;
      for(const c of CL.list){if(lockOf(c.id)&&!dkOk(c.id)){dkForget(c.id);if(c.id!==ACTIVE)delete WS_CACHE[c.id]}}
      if(LOCKED[ACTIVE]){S=null;setSync(ghTok()?'cloud':'local',ghTok()?'sync_gh':'sync_ghlocal');lsSave();render();return}
      S=WS_CACHE[ACTIVE]?normalize(WS_CACHE[ACTIVE]):blankState();WS_CACHE[ACTIVE]=S;
      if(idx.ws&&ghTok()&&!TEAM){for(const id of Object.keys(idx.ws)){const s2=normalize(idx.ws[id]);if(s2)ghWrite(wsPath(id),()=>s2)}saveClients()}
      setSync(ghTok()?'cloud':'local',ghTok()?'sync_gh':'sync_ghlocal');lsSave();render();return;
    }
  }
  if(ls&&ls.clients&&Array.isArray(ls.clients.list)&&ls.clients.list.length){CL=ls.clients;WS_CACHE=ls.ws||{};ACTIVE=CL.list.some(c=>c.id===ls.active)?ls.active:CL.list[0].id}
  else{const id='c-demo';CL={list:[{id,name:t('defaultClient'),color:PALETTE[0]}]};WS_CACHE={[id]:demoState('es')};ACTIVE=id}
  S=WS_CACHE[ACTIVE]?normalize(WS_CACHE[ACTIVE]):null;if(!S){S=blankState();WS_CACHE[ACTIVE]=S}
  render();initDb();
})();

</script>
